<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Projects — InfluenceCrafter Creator Hub</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body class="wide-page">
  <nav id="nav"></nav>
  <div class="page" id="app"></div>
  <div id="modal-root"></div>
  <div id="drawer-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8/dist/umd/supabase.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    let db, user;

    /* Admin-only internal collaboration tracker. Distinct from the public
       campaign marketplace (opportunities.html/collaboration.html) where
       creators apply and get reviewed — here the admin adds bloggers
       straight from the Blogger Database and tracks progress by hand.
       Phase 1 (this file): admin view only. Brand + blogger portal access
       to a read/limited-write slice of this data is a later phase. */
    let view = 'list'; // 'list' | 'detail'
    let activeProjectId = null;
    let projectStatusFilter = '';
    let projectListView = 'grid'; // 'grid' | 'kanban' — list-view display mode
    let projectDetailTab = 'overview'; // 'overview' | 'roster' | 'tasks' | 'reporting'
    let rosterGroupFilter = ''; // filters the inline roster tab's table by group_label

    /* State for the "Add blogger to project" modal's filters — reset each
       time the modal opens (see openAddBloggerModal). */
    let addBloggerCityFilter = '';
    let addBloggerHistoryFilter = ''; // '' | 'new' | 'returning'
    let addBloggerSortBy = 'name'; // 'name' | 'followers'
    let addBloggerNicheFilter = ''; // matches against blogger.category tags
    let addBloggerCountryFilter = ''; // matches against blogger.audienceCountries[0]
    let aiMatchLoading = false; // guards against double-submitting the AI-match request

    (async function () {
      const ctx = await requireRole(['admin']);
      if (ctx) { db = ctx.db; user = ctx.user; renderNav('projects.html', db, user); render(); }
    })();

    async function reload() { db = await loadDB(); }

    const PROJECT_STATUS_OPTIONS = { planning: 'Planning', active: 'Active', completed: 'Completed', archived: 'Archived' };

    /* Deal/negotiation stage — separate from p.status above, which tracks
       execution progress. This tracks where the client relationship stands
       (useful the moment a lead comes in, before there's anything to execute). */
    const DEAL_STATUS_META = {
      lead: { label: 'Lead', cls: 'badge-neutral' },
      negotiating: { label: 'Negotiating', cls: 'badge-warn' },
      confirmed: { label: 'Confirmed', cls: 'badge-positive' },
      active: { label: 'Active', cls: 'badge-positive' },
      completed: { label: 'Completed', cls: 'badge-neutral' },
    };

    /* Kept local (not in js/ui.js's shared STATUS_LABELS) because these are
       severity signals with specific colors, not generic status labels. */
    const TRACK_STATUS_META = {
      on_track: { label: 'On track', cls: 'badge-positive' },
      at_risk: { label: 'At risk', cls: 'badge-warn' },
      find_replacement: { label: 'Find replacement', cls: 'badge-negative' },
    };
    const CONTENT_STATUS_META = {
      not_posted: { label: 'Not posted', cls: 'badge-neutral' },
      draft_submitted: { label: 'Draft submitted', cls: 'badge-warn' },
      live: { label: 'Live', cls: 'badge-positive' },
    };
    /* Reel/TikTok/Post each get their own permanent link (see contentLinks
       jsonb + updateContentLink); Stories vanish, so they get their own
       Google-Drive-style link field instead (see rosterCard). */
    const CONTENT_FORMAT_OPTIONS = { reel: 'Reel', tiktok: 'TikTok', post: 'Post', stories: 'Stories' };

    /* Just starter suggestions in the group input's datalist — free text,
       so any custom group name typed once becomes reusable (same pattern
       as the "Other" nationality field in blogger-database.html). */
    const GROUP_PRESETS = ['New', 'Returning', 'Food bloggers', 'Event bloggers'];

    /* Seeded onto every new project — the standard 9-step admin workflow.
       Freely editable afterwards (check off / remove / add custom steps),
       so "Send brief to bloggers" etc. can just be deleted once it stops
       being relevant (e.g. once bloggers have direct portal access). */
    const PROJECT_CHECKLIST_TEMPLATE = [
      'Approve campaign',
      'Find bloggers',
      'Prepare brief',
      'Send brief to bloggers',
      'Collect expected visit dates',
      'Confirm everyone is on track',
      'Request statistics',
      'Log content',
      'Prepare report',
    ];

    function render() {
      const container = document.getElementById('app');
      container.innerHTML = (view === 'detail' && activeProjectId) ? renderProjectDetail() : renderProjectList();
    }

    function projectRoster(projectId) {
      return db.projectBloggers.filter((pb) => pb.projectId === projectId);
    }
    function projectChecklist(projectId) {
      return db.projectChecklist.filter((c) => c.projectId === projectId).sort((a, b) => a.stepOrder - b.stepOrder);
    }

    /* Every OTHER project this blogger has already been added to — lets the
       admin tell new vs. returning bloggers apart when building a roster. */
    function bloggerProjectHistory(bloggerId, excludeProjectId) {
      return db.projectBloggers
        .filter((pb) => pb.bloggerId === bloggerId && pb.projectId !== excludeProjectId)
        .map((pb) => db.projects.find((p) => p.id === pb.projectId))
        .filter(Boolean);
    }

    /* Distinct group_label values already used within one project, for the
       roster's filter chips + the group input's datalist. */
    function projectGroupValues(projectId) {
      const set = new Set();
      projectRoster(projectId).forEach((pb) => { if (pb.groupLabel) set.add(pb.groupLabel); });
      return [...set].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
    }

    /* ---------------- List view ---------------- */
    function renderProjectList() {
      const projects = [...db.projects]
        .filter((p) => !projectStatusFilter || p.status === projectStatusFilter)
        .sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));

      return `
        <div class="card-row" style="align-items:center;margin-bottom:18px;">
          <h1 style="margin:0;">Projects</h1>
          <div style="display:flex;gap:10px;align-items:center;">
            <div class="chip-select" style="margin:0;">
              <div class="chip ${projectListView === 'grid' ? 'selected' : ''}" onclick="setProjectListView('grid')">Grid</div>
              <div class="chip ${projectListView === 'kanban' ? 'selected' : ''}" onclick="setProjectListView('kanban')">Kanban</div>
            </div>
            <button class="btn btn-primary" onclick="openProjectModal()">+ New Project</button>
          </div>
        </div>
        <div class="chip-select" style="margin-bottom:18px;">
          <div class="chip ${!projectStatusFilter ? 'selected' : ''}" onclick="setProjectStatusFilter('')">All</div>
          ${Object.entries(PROJECT_STATUS_OPTIONS)
            .map(([k, v]) => `<div class="chip ${projectStatusFilter === k ? 'selected' : ''}" onclick="setProjectStatusFilter('${k}')">${v}</div>`)
            .join('')}
        </div>
        ${projects.length === 0
          ? `<div class="empty-state"><p>No projects yet.</p><button class="btn btn-primary btn-sm" onclick="openProjectModal()">+ New Project</button></div>`
          : projectListView === 'kanban'
            ? renderProjectKanban(projects)
            : `<div class="grid grid-3">${projects.map(projectCard).join('')}</div>`}
      `;
    }

    function setProjectListView(mode) { projectListView = mode; render(); }

    /* Kanban board grouped by deal stage (DEAL_STATUS_META keys) — lets the
       admin see the whole pipeline at a glance and drag-free re-stage a
       project via the inline <select> without opening the full edit modal. */
    function renderProjectKanban(projects) {
      const columns = Object.entries(DEAL_STATUS_META).map(([key, meta]) => ({
        key,
        label: meta.label,
        items: projects.filter((p) => (p.dealStatus || 'lead') === key),
      }));
      return `
        <div style="display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;">
          ${columns
            .map(
              (col) => `
            <div style="flex:0 0 260px;min-width:260px;">
              <div class="small muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px;">${escapeHtml(col.label)} <span class="muted">(${col.items.length})</span></div>
              <div style="display:flex;flex-direction:column;gap:10px;">
                ${col.items.map(kanbanCard).join('') || '<div class="small muted" style="padding:10px;border:1px dashed var(--line);border-radius:var(--radius-sm);">No projects</div>'}
              </div>
            </div>`
            )
            .join('')}
        </div>
      `;
    }

    function kanbanCard(p) {
      const roster = projectRoster(p.id);
      const risk = roster.filter((r) => r.visitTrackStatus === 'at_risk' || r.visitTrackStatus === 'find_replacement').length;
      return `
        <div class="card" style="padding:12px;cursor:pointer;" onclick="openProject('${p.id}')">
          <div style="font-weight:600;margin-bottom:4px;">${escapeHtml(p.title)}</div>
          ${p.category ? `<span class="tag">${escapeHtml(p.category)}</span>` : ''}
          <div class="small muted" style="margin-top:6px;">👥 ${roster.length}${risk ? ` · <span style="color:var(--orange);font-weight:700;">${risk} ⚠</span>` : ''}</div>
          <select onclick="event.stopPropagation()" onmousedown="event.stopPropagation()" onchange="event.stopPropagation();quickSetDealStatus('${p.id}',this.value)" style="margin-top:8px;width:100%;">
            ${Object.entries(DEAL_STATUS_META).map(([k, m]) => `<option value="${k}" ${p.dealStatus === k ? 'selected' : ''}>${m.label}</option>`).join('')}
          </select>
        </div>
      `;
    }

    async function quickSetDealStatus(projectId, status) {
      try {
        const updated = await dbUpdate('projects', projectId, { dealStatus: status });
        const idx = db.projects.findIndex((x) => x.id === projectId);
        if (idx >= 0) db.projects[idx] = updated;
      } catch (err) {
        console.error('quickSetDealStatus failed:', err);
        toast('Could not update deal stage: ' + (err && err.message ? err.message : 'unknown error'));
      } finally {
        render();
      }
    }

    function projectCard(p) {
      const roster = projectRoster(p.id);
      const risk = roster.filter((r) => r.visitTrackStatus === 'at_risk' || r.visitTrackStatus === 'find_replacement').length;
      return `
        <div class="card" style="cursor:pointer;" onclick="openProject('${p.id}')">
          <div class="card-row" style="margin-bottom:8px;">
            <h3 style="margin:0;">${escapeHtml(p.title)}</h3>
            <div style="display:flex;gap:6px;flex-shrink:0;">${dealBadge(p.dealStatus)}${badge(p.status)}</div>
          </div>
          ${p.category ? `<span class="tag">${escapeHtml(p.category)}</span>` : ''}
          <div class="small muted" style="margin-top:6px;">${p.startDate ? formatDate(p.startDate) : '—'} → ${p.endDate ? formatDate(p.endDate) : '—'}</div>
          <div class="small" style="margin-top:10px;">👥 ${roster.length} blogger${roster.length === 1 ? '' : 's'}${risk ? ` · <span style="color:var(--orange);font-weight:700;">${risk} need attention</span>` : ''}</div>
        </div>
      `;
    }

    function dealBadge(status) {
      const meta = DEAL_STATUS_META[status] || DEAL_STATUS_META.lead;
      return `<span class="badge ${meta.cls}">${escapeHtml(meta.label)}</span>`;
    }

    function setProjectStatusFilter(status) { projectStatusFilter = status; render(); }
    function openProject(id) { activeProjectId = id; view = 'detail'; projectDetailTab = 'overview'; rosterGroupFilter = ''; render(); }
    function backToProjects() { view = 'list'; activeProjectId = null; render(); }

    /* ---------------- Detail view ---------------- */
    /* Tabbed workspace (Overview / Roster & Content / Tasks / Reporting),
       modelled on how Grin/Aspire/CreatorIQ structure a campaign page —
       the roster lives inline in its own tab instead of behind an extra
       drawer click, and a persistent KPI strip stays visible across tabs
       so health-at-a-glance doesn't require switching tabs to see it. */
    function renderProjectDetail() {
      const p = db.projects.find((x) => x.id === activeProjectId);
      if (!p) { view = 'list'; activeProjectId = null; return renderProjectList(); }

      return `
        <button class="btn btn-ghost btn-sm" style="margin-bottom:14px;" onclick="backToProjects()">← All projects</button>
        <div class="card">
          <div class="card-row" style="margin-bottom:4px;">
            <div>
              <h1 style="margin:0 0 4px;">${escapeHtml(p.title)}</h1>
              ${p.category ? `<span class="tag">${escapeHtml(p.category)}</span>` : ''}
            </div>
            <div style="display:flex;gap:8px;align-items:center;flex-shrink:0;">
              ${dealBadge(p.dealStatus)}
              ${badge(p.status)}
              <button class="btn btn-ghost btn-sm" onclick="openProjectModal('${p.id}')">Edit</button>
              <button class="btn btn-danger btn-sm" onclick="deleteProject('${p.id}')">Delete</button>
            </div>
          </div>
        </div>
        <div id="project-dynamic-area">${projectDynamicArea(p)}</div>
      `;
    }

    /* Everything that changes without a page-level navigation (KPI numbers,
       the active tab, the tab's own content) lives inside one wrapper div
       so a single targeted refresh (refreshProjectDetailTab) can update it
       all at once after a roster/task edit, without losing scroll position
       by re-rendering the whole page. */
    function projectDynamicArea(p) {
      const roster = projectRoster(p.id);
      return `
        ${projectKpiStrip(p, roster)}
        <div class="tabs" style="margin:16px 0;">
          <button class="${projectDetailTab === 'overview' ? 'active' : ''}" onclick="switchProjectTab('overview')">Overview</button>
          <button class="${projectDetailTab === 'roster' ? 'active' : ''}" onclick="switchProjectTab('roster')">Roster &amp; Content</button>
          <button class="${projectDetailTab === 'tasks' ? 'active' : ''}" onclick="switchProjectTab('tasks')">Tasks</button>
          <button class="${projectDetailTab === 'reporting' ? 'active' : ''}" onclick="switchProjectTab('reporting')">Reporting</button>
        </div>
        <div id="project-tab-content">${projectTabContent(p)}</div>
      `;
    }

    function switchProjectTab(tab) {
      projectDetailTab = tab;
      if (tab === 'roster') rosterGroupFilter = '';
      render();
    }

    /* Targeted refresh — replaces every old renderRosterAndRefresh() call
       site now that the roster lives inline instead of in a drawer. Re-reads
       `p` fresh so stale closures over an edited/deleted project can't happen. */
    function refreshProjectDetailTab() {
      const p = db.projects.find((x) => x.id === activeProjectId);
      const el = document.getElementById('project-dynamic-area');
      if (!p || !el) return;
      el.innerHTML = projectDynamicArea(p);
    }

    function projectTabContent(p) {
      if (projectDetailTab === 'roster') return projectRosterTab(p);
      if (projectDetailTab === 'tasks') return renderChecklistCard(p);
      if (projectDetailTab === 'reporting') return projectReportingTab(p);
      return projectOverviewTab(p);
    }

    /* Persistent health-at-a-glance bar, visible regardless of which tab is
       active — the pattern CreatorIQ/Aspire use on a campaign workspace so
       you don't have to hop tabs just to see if anything needs attention. */
    function projectKpiStrip(p, roster) {
      const atRisk = roster.filter((r) => r.visitTrackStatus === 'at_risk' || r.visitTrackStatus === 'find_replacement').length;
      const live = roster.filter((r) => r.contentStatus === 'live').length;
      const livePct = roster.length ? Math.round((live / roster.length) * 100) : 0;
      const daysLeft = p.contentDeadline ? Math.ceil((new Date(p.contentDeadline) - new Date()) / 86400000) : null;
      const overdue = daysLeft != null && daysLeft < 0;
      return `
        <div class="card-row" style="gap:10px;flex-wrap:wrap;">
          <div class="card" style="flex:1;min-width:140px;padding:12px 16px;text-align:center;">
            <div style="font-size:22px;font-weight:700;">${roster.length}</div>
            <div class="small muted">Bloggers</div>
          </div>
          <div class="card" style="flex:1;min-width:140px;padding:12px 16px;text-align:center;${atRisk ? 'border-color:var(--orange);' : ''}">
            <div style="font-size:22px;font-weight:700;${atRisk ? 'color:var(--orange);' : ''}">${atRisk}</div>
            <div class="small muted">At risk</div>
          </div>
          <div class="card" style="flex:1;min-width:140px;padding:12px 16px;text-align:center;">
            <div style="font-size:22px;font-weight:700;">${live}/${roster.length} <span class="small muted" style="font-weight:400;">(${livePct}%)</span></div>
            <div class="small muted">Content live</div>
          </div>
          <div class="card" style="flex:1;min-width:140px;padding:12px 16px;text-align:center;${overdue ? 'border-color:var(--red);' : ''}">
            <div style="font-size:22px;font-weight:700;${overdue ? 'color:var(--red);' : ''}">${daysLeft == null ? '—' : overdue ? Math.abs(daysLeft) + 'd overdue' : daysLeft + 'd'}</div>
            <div class="small muted">To deadline</div>
          </div>
        </div>
      `;
    }

    /* ---------------- Overview tab ---------------- */
    function projectOverviewTab(p) {
      const roster = projectRoster(p.id);
      const checklist = projectChecklist(p.id);
      const done = checklist.filter((i) => i.done).length;
      return `
        <div class="grid grid-2">
          <div class="card">
            <div class="small muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;">Brief</div>
            <p style="white-space:pre-wrap;">${p.brief ? escapeHtml(p.brief) : '<span class="muted">No brief added yet.</span>'}</p>
            ${p.briefPdfLink ? `<a class="small" href="${escapeHtml(p.briefPdfLink)}" target="_blank" rel="noopener">📄 Presentation (PDF)</a>` : ''}
            <hr class="divider" />
            <div class="small muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;">Deliverables</div>
            <p style="white-space:pre-wrap;">${p.deliverables ? escapeHtml(p.deliverables) : '<span class="muted">—</span>'}</p>
          </div>
          <div class="card">
            <div class="small muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;">Address</div>
            <p>${p.address ? escapeHtml(p.address) : '<span class="muted">—</span>'}</p>
            <div class="grid grid-2" style="margin-top:4px;">
              <div><div class="small muted" style="font-weight:700;">Dates</div><div>${p.startDate ? formatDate(p.startDate) : '—'} → ${p.endDate ? formatDate(p.endDate) : '—'}</div></div>
              <div><div class="small muted" style="font-weight:700;">Content deadline</div><div>${p.contentDeadline ? formatDate(p.contentDeadline) : '—'}</div></div>
            </div>
            <div class="small muted" style="font-weight:700;margin-top:10px;">Notes</div>
            <div>${p.notes ? escapeHtml(p.notes) : '—'}</div>
          </div>
        </div>
        <div class="card">
          <div class="card-row" style="align-items:center;margin-bottom:6px;">
            <h3 style="margin:0;">Deal <span class="muted small">(${(DEAL_STATUS_META[p.dealStatus] || DEAL_STATUS_META.lead).label})</span></h3>
          </div>
          <div class="grid grid-2">
            <div>
              <div class="small muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;">Client contact</div>
              <p style="white-space:pre-wrap;">${p.clientContact ? escapeHtml(p.clientContact) : '<span class="muted">—</span>'}</p>
            </div>
            <div>
              <div class="small muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;">Terms</div>
              <p style="white-space:pre-wrap;">${p.contractTerms ? escapeHtml(p.contractTerms) : '<span class="muted">—</span>'}</p>
            </div>
          </div>
        </div>
        <div class="grid grid-2">
          <div class="card" style="cursor:pointer;" onclick="switchProjectTab('roster')">
            <div class="card-row" style="align-items:center;">
              <div>
                <h3 style="margin:0;">Roster <span class="muted small">(${roster.length})</span></h3>
                <div class="small muted" style="margin-top:4px;">${roster.length ? rosterQuickSummary(roster) : 'No bloggers added yet'}</div>
              </div>
              <button class="btn btn-secondary btn-sm">Open roster →</button>
            </div>
          </div>
          <div class="card" style="cursor:pointer;" onclick="switchProjectTab('tasks')">
            <div class="card-row" style="align-items:center;">
              <div>
                <h3 style="margin:0;">Tasks <span class="muted small">(${done}/${checklist.length})</span></h3>
                <div class="small muted" style="margin-top:4px;">${checklist.length ? 'Workflow checklist' : 'No checklist yet'}</div>
              </div>
              <button class="btn btn-secondary btn-sm">Open tasks →</button>
            </div>
          </div>
        </div>
      `;
    }

    /* ---------------- Reporting tab ---------------- */
    /* Rolls up blogger_performance_history entries tagged to this project
       (project_id — see supabase/patch-2026-10-13.sql) into campaign-level
       totals a brand can actually be handed, plus a per-blogger breakdown
       and a "missing stats" nudge list for roster members with zero
       entries logged against this campaign yet. */
    function projectReportingTab(p) {
      const roster = projectRoster(p.id);
      const history = (db.bloggerPerformanceHistory || []).filter((h) => h.projectId === p.id);

      if (history.length === 0) {
        return `
          <div class="card">
            <h3 style="margin-top:0;">Reporting</h3>
            <p class="muted small">No performance stats tagged to this project yet. Log stats on each blogger's card in Blogger Database (Performance history tab) and pick this project in the "Project" field — the numbers will roll up here automatically, ready to share with the brand.</p>
          </div>
        `;
      }

      const totals = history.reduce(
        (acc, h) => {
          acc.views += Number(h.views) || 0;
          acc.likes += Number(h.likes) || 0;
          acc.comments += Number(h.comments) || 0;
          acc.shares += Number(h.shares) || 0;
          return acc;
        },
        { views: 0, likes: 0, comments: 0, shares: 0 }
      );
      const ers = history.map((h) => Number(h.er)).filter((n) => !isNaN(n) && n != null);
      const avgEr = ers.length ? (ers.reduce((a, b) => a + b, 0) / ers.length).toFixed(2) : null;

      const byBlogger = roster
        .map((pb) => {
          const b = db.bloggerDirectory.find((x) => x.id === pb.bloggerId);
          const entries = history.filter((h) => h.bloggerId === pb.bloggerId);
          const bTotals = entries.reduce(
            (acc, h) => {
              acc.views += Number(h.views) || 0;
              acc.likes += Number(h.likes) || 0;
              acc.comments += Number(h.comments) || 0;
              return acc;
            },
            { views: 0, likes: 0, comments: 0 }
          );
          return { name: b ? b.profileName || 'Untitled blogger' : 'Blogger removed from database', entries: entries.length, ...bTotals };
        });
      const missing = byBlogger.filter((r) => r.entries === 0);

      return `
        <div class="card">
          <h3 style="margin-top:0;">Campaign totals</h3>
          <div class="grid grid-3">
            <div><div class="small muted" style="font-weight:700;">Views</div><div style="font-size:20px;font-weight:700;">${totals.views.toLocaleString()}</div></div>
            <div><div class="small muted" style="font-weight:700;">Likes</div><div style="font-size:20px;font-weight:700;">${totals.likes.toLocaleString()}</div></div>
            <div><div class="small muted" style="font-weight:700;">Comments</div><div style="font-size:20px;font-weight:700;">${totals.comments.toLocaleString()}</div></div>
            <div><div class="small muted" style="font-weight:700;">Shares</div><div style="font-size:20px;font-weight:700;">${totals.shares.toLocaleString()}</div></div>
            <div><div class="small muted" style="font-weight:700;">Avg ER</div><div style="font-size:20px;font-weight:700;">${avgEr != null ? avgEr + '%' : '—'}</div></div>
            <div><div class="small muted" style="font-weight:700;">Posts logged</div><div style="font-size:20px;font-weight:700;">${history.length}</div></div>
          </div>
        </div>
        <div class="card">

    function rosterQuickSummary(roster) {
      const risk = roster.filter((r) => r.visitTrackStatus === 'at_risk').length;
      const replace = roster.filter((r) => r.visitTrackStatus === 'find_replacement').length;
      const live = roster.filter((r) => r.contentStatus === 'live').length;
      const parts = [];
      if (risk) parts.push(`${risk} at risk`);
      if (replace) parts.push(`${replace} need replacement`);
      parts.push(`${live}/${roster.length} content live`);
      return parts.join(' · ');
    }

    /* ---------------- Roster & Content tab (inline, no drawer) ---------------- */
    function setRosterGroupFilter(group) { rosterGroupFilter = group; refreshProjectDetailTab(); }

    /* Clusters the (possibly group-filtered) roster into ordered sections —
       named groups alphabetically first, "Ungrouped" last — so bloggers in
       the same group always render together instead of scattered through
       an alphabetical table. */
    function groupedRoster(projectId) {
      const roster = projectRoster(projectId);
      const visible = rosterGroupFilter ? roster.filter((r) => (r.groupLabel || '') === rosterGroupFilter) : roster;
      const buckets = {};
      visible.forEach((pb) => {
        const key = pb.groupLabel || '';
        (buckets[key] = buckets[key] || []).push(pb);
      });
      const namedKeys = Object.keys(buckets).filter((k) => k !== '').sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
      const orderedKeys = buckets[''] ? [...namedKeys, ''] : namedKeys;
      return orderedKeys.map((key) => ({ key, label: key || 'Ungrouped', bloggers: buckets[key] }));
    }

    /* Every field save is wrapped end-to-end (including the synchronous
       lookup) and always re-renders in `finally`, so a save failure surfaces
       as a toast instead of the UI just doing nothing — see the same fix
       applied earlier to blogger-database.html's submitBlogger(). */
    async function updateRoster(pbId, field, value) {
      try {
        const pb = db.projectBloggers.find((x) => x.id === pbId);
        if (!pb) return;
        pb[field] = value;
        await dbUpdate('projectBloggers', pbId, { [field]: value });
      } catch (err) {
        console.error('updateRoster failed:', err);
        toast('Could not save: ' + (err && err.message ? err.message : 'unknown error'));
      } finally {
        refreshProjectDetailTab();
      }
    }

    async function toggleContentFormat(pbId, format) {
      try {
        const pb = db.projectBloggers.find((x) => x.id === pbId);
        if (!pb) return;
        const current = pb.contentFormat || [];
        const next = current.includes(format) ? current.filter((f) => f !== format) : [...current, format];
        pb.contentFormat = next;
        await dbUpdate('projectBloggers', pbId, { contentFormat: next });
      } catch (err) {
        console.error('toggleContentFormat failed:', err);
        toast('Could not save: ' + (err && err.message ? err.message : 'unknown error'));
      } finally {
        refreshProjectDetailTab();
      }
    }

    /* Used by the Visit happened / Requested / Submitted pill toggles —
       same save-then-always-rerender contract as updateRoster. */
    async function toggleBoolField(pbId, field) {
      try {
        const pb = db.projectBloggers.find((x) => x.id === pbId);
        if (!pb) return;
        const next = !pb[field];
        pb[field] = next;
        await dbUpdate('projectBloggers', pbId, { [field]: next });
      } catch (err) {
        console.error('toggleBoolField failed:', err);
        toast('Could not save: ' + (err && err.message ? err.message : 'unknown error'));
      } finally {
        refreshProjectDetailTab();
      }
    }

    /* One link per selected format (Reel/TikTok/Post can each have their
       own permanent link) — stored as a single jsonb object keyed by
       format so picking both Reel and TikTok shows two separate fields. */
    async function updateContentLink(pbId, format, value) {
      try {
        const pb = db.projectBloggers.find((x) => x.id === pbId);
        if (!pb) return;
        const links = { ...(pb.contentLinks || {}), [format]: value };

    /* ---------------- AI script generation, scoped to this project's brief ---------------- */
    function bloggerHistoryFor(bloggerId) {
      return (db.bloggerPerformanceHistory || [])
        .filter((h) => h.bloggerId === bloggerId)
        .sort((a, c) => new Date(c.postedAt || c.createdAt || 0) - new Date(a.postedAt || a.createdAt || 0));
    }

    async function generateScriptForRoster(pbId) {
      const pb = db.projectBloggers.find((x) => x.id === pbId);
      const b = pb && db.bloggerDirectory.find((x) => x.id === pb.bloggerId);
      const p = pb && db.projects.find((x) => x.id === pb.projectId);
      if (!pb || !b || !p) return;

      document.getElementById('modal-root').innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
          <div class="modal">
            <button class="modal-close" onclick="closeModal()">×</button>
            <h2 style="margin-top:0;">✨ AI script — ${escapeHtml(b.profileName)}</h2>
            <div class="small muted" style="margin-bottom:10px;">For project: ${escapeHtml(p.title)}</div>
            <div id="ai-script-result" class="small muted">Generating…</div>
          </div>
        </div>`;

      try {
        const payload = {
          blogger: {
            name: b.profileName,
            category: b.category || [],
            pastBrands: b.pastBrands || [],
            city: b.city || '',
            audienceCountry: (b.audienceCountries || [])[0] || '',
            followers: b.followersCount || null,
            er: b.engagementRate || null,
          },
          history: bloggerHistoryFor(b.id).slice(0, 10).map((h) => ({
            platform: h.platform,
            views: h.views,
            likes: h.likes,
            comments: h.comments,
            er: h.er,
            notes: h.notes,
          })),
          brief: p.brief || undefined,
        };
        const res = await fetch('/api/generate-script', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
        const row = await dbInsert('aiRecommendations', {
          bloggerId: b.id,
          projectId: p.id,
          content: data.content,
          model: 'claude-opus-4-7',
          status: 'draft',
          createdAt: nowISO(),
        });
        db.aiRecommendations = db.aiRecommendations || [];
        db.aiRecommendations.push(row);
        const el = document.getElementById('ai-script-result');
        if (el) el.outerHTML = `<div class="small" style="white-space:pre-wrap;">${escapeHtml(data.content)}</div>`;
        toast('Script generated and saved — view it on the blogger\'s card in Blogger Database.');
      } catch (err) {
        console.error('generateScriptForRoster failed:', err);
        const el = document.getElementById('ai-script-result');
        if (el) el.textContent = 'Could not generate: ' + (err && err.message ? err.message : 'unknown error');
      }
    }

    function addBloggerCityOptions() {
      const set = new Set();
      db.bloggerDirectory.forEach((b) => { if (b.city && b.city.trim()) set.add(b.city.trim()); });
      return [...set].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
    }

    /* Niche/category tags set on each blogger (blogger-database.html) —
       used here to strategically match bloggers to a campaign's topic. */
    function addBloggerNicheOptions() {
      const set = new Set();
      db.bloggerDirectory.forEach((b) => (b.category || []).forEach((c) => c && set.add(c.trim())));
      return [...set].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
    }

    /* First entry of audienceCountries is the blogger's own
       nationality/market (see blogger-database.html) — used as a quick
       "only Czech / only Russian-speaking" style filter. */
    function addBloggerCountryOptions() {
      const set = new Set();
      db.bloggerDirectory.forEach((b) => { const c = (b.audienceCountries || [])[0]; if (c) set.add(c); });
      return [...set].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
    }

    function onAddBloggerFilterChange(projectId) {
      addBloggerCityFilter = document.getElementById('add-blogger-city').value;
      addBloggerNicheFilter = document.getElementById('add-blogger-niche').value;
      addBloggerCountryFilter = document.getElementById('add-blogger-country').value;
      addBloggerHistoryFilter = document.getElementById('add-blogger-history').value;
      addBloggerSortBy = document.getElementById('add-blogger-sort').value;
      renderAddBloggerResults(projectId);
    }

    function renderAddBloggerResults(projectId) {
      const q = (document.getElementById('add-blogger-search').value || '').trim().toLowerCase();
      const already = new Set(projectRoster(projectId).map((pb) => pb.bloggerId));
      let results = db.bloggerDirectory
        .filter((b) => !already.has(b.id))
        .filter((b) => !q || `${b.profileName || ''} ${b.instagramUrl || ''} ${b.city || ''}`.toLowerCase().includes(q))
        .filter((b) => !addBloggerCityFilter || (b.city || '').trim().toLowerCase() === addBloggerCityFilter)
        .filter((b) => !addBloggerNicheFilter || (b.category || []).some((c) => c.trim().toLowerCase() === addBloggerNicheFilter))
        .filter((b) => !addBloggerCountryFilter || (b.audienceCountries || [])[0] === addBloggerCountryFilter)
        .map((b) => ({ blogger: b, history: bloggerProjectHistory(b.id, projectId) }));

      if (addBloggerHistoryFilter === 'new') results = results.filter((r) => r.history.length === 0);
      if (addBloggerHistoryFilter === 'returning') results = results.filter((r) => r.history.length > 0);

      results.sort((a, b) =>
        addBloggerSortBy === 'followers'
          ? (Number(b.blogger.followersCount) || 0) - (Number(a.blogger.followersCount) || 0)
          : (a.blogger.profileName || '').localeCompare(b.blogger.profileName || '', undefined, { sensitivity: 'base' })
      );
      results = results.slice(0, 40);

      const el = document.getElementById('add-blogger-results');
      el.innerHTML = results.length === 0
        ? `<p class="muted small">No matching bloggers.</p>`
        : results
            .map(({ blogger: b, history }) => `
        <div class="card-row" style="padding:9px 0;border-bottom:1px solid var(--line-soft);align-items:center;">
          <div>
            <div style="font-weight:600;">${escapeHtml(b.profileName || 'Untitled blogger')}</div>
            <div class="small muted">${escapeHtml(b.city || '')}${b.followersCount != null ? ' · ' + Number(b.followersCount).toLocaleString() + ' followers' : ''}${(b.audienceCountries || [])[0] ? ' · ' + escapeHtml(b.audienceCountries[0]) : ''}</div>
            ${(b.category || []).length ? `<div style="margin-top:2px;">${b.category.map((c) => `<span class="tag">${escapeHtml(c)}</span>`).join(' ')}</div>` : ''}
            <div class="small" style="margin-top:3px;">${
              history.length === 0
                ? `<span class="badge badge-positive">🆕 New</span>`
                : `<span class="badge badge-neutral" title="${escapeHtml(history.map((p) => p.title).join(', '))}">Worked on ${history.length} project${history.length === 1 ? '' : 's'}: ${escapeHtml(history.map((p) => p.title).slice(0, 2).join(', '))}${history.length > 2 ? '…' : ''}</span>`
            }</div>
          </div>
          <button class="btn btn-secondary btn-sm" onclick="addBloggerToProject('${projectId}','${b.id}')">+ Add</button>
        </div>`)
            .join('');
    }

    async function addBloggerToProject(projectId, bloggerId) {
      try {
        const row = await dbInsert('projectBloggers', {
          projectId,
          bloggerId,
          expectedVisitDate: null,
          visitTrackStatus: 'on_track',
          actualVisitDate: null,
          visitConfirmed: false,
          contentStatus: 'not_posted',
          contentFormat: [],
          contentLinks: {},
          storiesLink: '',
          groupLabel: '',
          statsRequested: false,
          statsSubmitted: false,
          notes: '',
          createdAt: nowISO(),
        });
        db.projectBloggers.push(row);
        toast('Blogger added.');
        renderAddBloggerResults(projectId);
        refreshProjectDetailTab();
      } catch (err) {
        console.error('addBloggerToProject failed:', err);
        toast('Could not add: ' + (err && err.message ? err.message : 'unknown error'));
      }
    }

    /* AI-driven blogger matching for a new campaign wave: admin describes
       the brief in free text, Claude ranks the current candidate pool
       (respecting whatever manual filters are already set above) using
       each blogger's profile, performance history and past brand
       collaborations (internal projects + external pastBrands tags). */
    function toggleAiMatchPanel() {
      const panel = document.getElementById('ai-match-panel');
      if (panel) panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    }

    async function runAiMatch(projectId) {
      if (aiMatchLoading) return;
      const briefEl = document.getElementById('ai-match-brief');
      const resultsEl = document.getElementById('ai-match-results');
      const brief = (briefEl && briefEl.value || '').trim();
      const already = new Set(projectRoster(projectId).map((pb) => pb.bloggerId));
      let pool = db.bloggerDirectory
        .filter((b) => !already.has(b.id))
        .filter((b) => !addBloggerCityFilter || (b.city || '').trim().toLowerCase() === addBloggerCityFilter)
        .filter((b) => !addBloggerNicheFilter || (b.category || []).some((c) => c.trim().toLowerCase() === addBloggerNicheFilter))
        .filter((b) => !addBloggerCountryFilter || (b.audienceCountries || [])[0] === addBloggerCountryFilter);

      if (addBloggerHistoryFilter === 'new') pool = pool.filter((b) => bloggerProjectHistory(b.id, projectId).length === 0);
      if (addBloggerHistoryFilter === 'returning') pool = pool.filter((b) => bloggerProjectHistory(b.id, projectId).length > 0);

      if (pool.length === 0) {
        resultsEl.innerHTML = '<p class="small muted">Нет кандидатов под текущие фильтры выше — ослабь фильтр и попробуй снова.</p>';
        return;
      }

      const capped = pool.length > 60
        ? [...pool].sort((a, c) => (Number(c.followersCount) || 0) - (Number(a.followersCount) || 0)).slice(0, 60)
        : pool;

      aiMatchLoading = true;
      resultsEl.innerHTML = `<p class="small muted">Анализирую ${capped.length} кандидат${capped.length === 1 ? 'а' : 'ов'}…</p>`;

      try {
        const candidates = capped.map((b) => ({
          id: b.id,
          name: b.profileName,
          category: b.category || [],
          city: b.city || '',
          audienceCountry: (b.audienceCountries || [])[0] || '',
          followers: b.followersCount || null,
          er: b.engagementRate || null,
          pastBrands: b.pastBrands || [],
          internalProjects: bloggerProjectHistory(b.id, projectId).map((p) => p.title),
          historyNotes: bloggerHistoryFor(b.id)
            .slice(0, 5)
            .map((h) => `${h.platform || ''} ER:${h.er ?? '—'}% views:${h.views ?? '—'} ${h.notes || ''}`.trim())
            .join('; '),
        }));

        const res = await fetch('/api/match-bloggers', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ brief, candidates }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);

        const byId = new Map(capped.map((b) => [b.id, b]));
        const ranked = (data.matches || []).filter((m) => byId.has(m.bloggerId));

        resultsEl.innerHTML = ranked.length === 0
          ? '<p class="small muted">AI не вернул ранжированный список.</p>'
          : ranked
              .map((m, i) => {
                const b = byId.get(m.bloggerId);
                return `
          <div class="card-row" id="ai-match-row-${b.id}" style="padding:9px 0;border-bottom:1px solid var(--line-soft);align-items:center;">
            <div>
              <div style="font-weight:600;">#${i + 1} ${escapeHtml(b.profileName || 'Untitled blogger')}</div>
              <div class="small muted">${escapeHtml(b.city || '')}${b.followersCount != null ? ' · ' + Number(b.followersCount).toLocaleString() + ' followers' : ''}</div>
              <div class="small" style="margin-top:3px;">${escapeHtml(m.reason || '')}</div>
            </div>
            <button class="btn btn-secondary btn-sm" onclick="addFromAiMatch('${projectId}','${b.id}')">+ Add</button>
          </div>`;
              })
              .join('');
      } catch (err) {
        console.error('runAiMatch failed:', err);
        resultsEl.innerHTML = `<p class="small" style="color:#c0392b;">Не получилось получить подбор: ${escapeHtml(err && err.message ? err.message : 'unknown error')}</p>`;
      } finally {
        aiMatchLoading = false;
      }
    }

    async function addFromAiMatch(projectId, bloggerId) {
      await addBloggerToProject(projectId, bloggerId);
      const row = document.getElementById('ai-match-row-' + bloggerId);
      if (row) row.remove();
    }

    /* ---------------- Project create/edit modal ---------------- */
    function openProjectModal(id) {
      const p = id ? db.projects.find((x) => x.id === id) : null;
      document.getElementById('modal-root').innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
          <div class="modal">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <h2 style="margin-top:0;">${p ? 'Edit project' : 'New project'}</h2>
            <label>Title</label>
            <input id="p-title" value="${p ? escapeHtml(p.title) : ''}" placeholder="e.g. Bowlers brunch" />
            <label>Category <span class="muted small">(optional)</span></label>
            <input id="p-category" value="${p ? escapeHtml(p.category || '') : ''}" placeholder="e.g. Gastro" />
            <label>Status</label>
            <select id="p-status">
              ${Object.entries(PROJECT_STATUS_OPTIONS).map(([k, v]) => `<option value="${k}" ${(p ? p.status : 'planning') === k ? 'selected' : ''}>${v}</option>`).join('')}
            </select>
            <label>Deal stage</label>
            <select id="p-deal-status">
              ${Object.entries(DEAL_STATUS_META).map(([k, m]) => `<option value="${k}" ${(p ? p.dealStatus : 'lead') === k ? 'selected' : ''}>${m.label}</option>`).join('')}
            </select>
            <label>Client contact <span class="muted small">(name, email, phone…)</span></label>
            <textarea id="p-client-contact" placeholder="Who we're dealing with on the client side">${p ? escapeHtml(p.clientContact || '') : ''}</textarea>
            <label>Deal terms <span class="muted small">(barter/paid, amounts, what's included…)</span></label>
            <textarea id="p-contract-terms" placeholder="What we agreed on">${p ? escapeHtml(p.contractTerms || '') : ''}</textarea>
            <label>Brief</label>
            <textarea id="p-brief" placeholder="Concept, what's expected...">${p ? escapeHtml(p.brief || '') : ''}</textarea>
            <label>Brief PDF link <span class="muted small">(Google Drive, Dropbox…)</span></label>
            <input id="p-brief-pdf" value="${p ? escapeHtml(p.briefPdfLink || '') : ''}" placeholder="https://drive.google.com/..." />
            <label>Deliverables</label>
            <textarea id="p-deliverables" placeholder="e.g. 1 Reel + 3 Stories per blogger">${p ? escapeHtml(p.deliverables || '') : ''}</textarea>
            <label>Address</label>
            <input id="p-address" value="${p ? escapeHtml(p.address || '') : ''}" placeholder="Venue address" />
            <div class="grid grid-2">
              <div><label>Start date</label><input id="p-start" type="date" value="${p && p.startDate ? p.startDate : ''}" /></div>
              <div><label>End date</label><input id="p-end" type="date" value="${p && p.endDate ? p.endDate : ''}" /></div>
            </div>
            <label>Content deadline</label>
            <input id="p-content-deadline" type="date" value="${p && p.contentDeadline ? p.contentDeadline : ''}" />
            <label>Notes</label>
            <textarea id="p-notes" placeholder="Anything else to remember...">${p ? escapeHtml(p.notes || '') : ''}</textarea>
            <button class="btn btn-primary btn-block" style="margin-top:18px;" onclick="submitProject('${p ? p.id : ''}')">${p ? 'Save changes' : 'Create project'}</button>
          </div>
        </div>
      `;
    }
    function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

    function readProjectForm() {
      return {
        title: document.getElementById('p-title').value.trim(),
        category: document.getElementById('p-category').value.trim(),
        status: document.getElementById('p-status').value,
        dealStatus: document.getElementById('p-deal-status').value,
        clientContact: document.getElementById('p-client-contact').value.trim(),
        contractTerms: document.getElementById('p-contract-terms').value.trim(),
        brief: document.getElementById('p-brief').value.trim(),
        briefPdfLink: document.getElementById('p-brief-pdf').value.trim(),
        deliverables: document.getElementById('p-deliverables').value.trim(),
        address: document.getElementById('p-address').value.trim(),
        startDate: document.getElementById('p-start').value || null,
        endDate: document.getElementById('p-end').value || null,
        contentDeadline: document.getElementById('p-content-deadline').value || null,
        notes: document.getElementById('p-notes').value.trim(),
      };
    }

    async function submitProject(id) {
      try {
        const fields = readProjectForm();
        if (!fields.title) fields.title = 'Untitled project';
        if (id) {
          const updated = await dbUpdate('projects', id, fields);
          const idx = db.projects.findIndex((x) => x.id === id);
          if (idx >= 0) db.projects[idx] = updated;
          toast('Project updated.');
        } else {
          const row = await dbInsert('projects', { ...fields, createdAt: nowISO() });
          db.projects.push(row);
          const checklistRows = await dbInsertMany(
            'projectChecklist',
            PROJECT_CHECKLIST_TEMPLATE.map((title, i) => ({
              projectId: row.id,
              stepOrder: i,
              title,
              done: false,
              doneAt: null,
              createdAt: nowISO(),
            }))
          );
          db.projectChecklist.push(...checklistRows);
          toast('Project created.');
        }
      } catch (err) {
        console.error('submitProject failed:', err);
        toast('Could not save: ' + (err && err.message ? err.message : 'unknown error'));
        return;
      }
      closeModal();
      render();
    }

    async function deleteProject(id) {
      if (!confirm('Delete this project and its entire roster? This cannot be undone.')) return;
      try {
        await dbDelete('projects', id);
        db.projects = db.projects.filter((x) => x.id !== id);
        db.projectBloggers = db.projectBloggers.filter((x) => x.projectId !== id);
        db.projectChecklist = db.projectChecklist.filter((x) => x.projectId !== id);
        toast('Project deleted.');
      } catch (err) {
        console.error('deleteProject failed:', err);
        toast('Could not delete: ' + (err && err.message ? err.message : 'unknown error'));
        return;
      }
      backToProjects();
    }
  </script>
</body>
