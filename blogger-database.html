<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blogger Database — InfluenceCrafter Creator Hub</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body class="wide-page">
  <nav id="nav"></nav>
  <div class="page" id="app"></div>
  <div id="modal-root"></div>
  <div id="drawer-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8/dist/umd/supabase.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    let db, user;

    /* Light filters (search, collab type, status) apply everywhere.
       City / language are navigated as tabs (no more endless scrolling
       through every group at once — click a tab, see just that slice). */
    let filters = { search: '', collabType: '', status: '' };
    let activeCity = null; // null = "All cities"
    let originFilter = []; // quick nationality pills, OR-filter within current tab
    let genderFilter = []; // quick gender pills, OR-filter within current tab
    let sortBy = 'name'; // 'name' | 'followers' | 'er' | 'newest' | 'oldest'

    (async function () {
      const ctx = await requireRole(['admin']);
      if (ctx) { db = ctx.db; user = ctx.user; renderNav('blogger-database.html', db, user); render(); }
    })();

    async function reload() { db = await loadDB(); }

    const COLLAB_TYPE_LABELS = { barter: 'Barter', paid: 'Paid', both: 'Barter or paid' };
    const STATUS_LABELS_LOCAL = { active: 'Active', contacted: 'Contacted', archived: 'Archived' };
    /* Defaults shown in the city dropdown, in local spelling — the list
       grows on its own as new cities get used (see buildOptionList). */
    const CITY_SUGGESTIONS = ['Praha', 'Plzeň', 'Brno', 'Kraków', 'Warszawa'];
    /* This describes the blogger themself (nationality / market they belong
       to) — not their audience. It's a single choice ("either/or"). The five
       common markets are one-click chips; anything else (Polish, German,
       Vietnamese expat bloggers, etc.) goes through "Other" as free text so
       the list never needs a code change to stay accurate. */
    const KNOWN_ORIGIN_CODES = ['RU', 'UA', 'CZ', 'SK', 'EN'];
    const ORIGIN_OPTIONS = [...KNOWN_ORIGIN_CODES, 'OTHER'];
    const ORIGIN_META = {
      RU: { flag: '🇷🇺', label: 'Russian', color: '#1d4ed8', bg: '#eff6ff' },
      UA: { flag: '🇺🇦', label: 'Ukrainian', color: '#a16207', bg: '#fefce8' },
      CZ: { flag: '🇨🇿', label: 'Czech', color: '#b91c1c', bg: '#fef2f2' },
      SK: { flag: '🇸🇰', label: 'Slovak', color: '#7c3aed', bg: '#f5f3ff' },
      EN: { flag: '🌍', label: 'English-speaking', color: '#15803d', bg: '#ecfdf3' },
      OTHER: { flag: '⚪', label: 'Other', color: 'var(--ink-soft)', bg: 'var(--grey-bg)' },
    };
    /* Falls back gracefully for custom free-text values (e.g. "Polish") that
       were typed into the "Other" field — shown with a neutral badge. */
    function originMeta(code) { return ORIGIN_META[code] || { flag: '⚪', label: code, color: 'var(--ink-soft)', bg: 'var(--grey-bg)' }; }

    /* Gender of the blogger — a second, independent axis so combos like
       "Prague + Czech + Female" are one tab + two pill clicks away. */
    const GENDER_OPTIONS = ['female', 'male', 'other'];
    const GENDER_META = {
      female: { icon: '♀', label: 'Female', color: '#db2777', bg: '#fdf2f8' },
      male: { icon: '♂', label: 'Male', color: '#2563eb', bg: '#eff6ff' },
      other: { icon: '•', label: 'Other', color: 'var(--ink-soft)', bg: 'var(--grey-bg)' },
    };

    /* Structured audience data — who follows the blogger, as opposed to the
       blogger's own city/nationality/gender above. Stored as one jsonb blob
       (audienceStats: { genderSplit, ageRanges, topCities }) since it's a
       flexible, variable-length shape that doesn't need its own table. */
    const AUDIENCE_AGE_BRACKETS = ['13-17', '18-24', '25-34', '35-44', '45-54', '55+'];

    function audienceStatsSummary(b) {
      const s = b.audienceStats || {};
      const parts = [];
      if (s.genderSplit) {
        const top = ['female', 'male', 'other']
          .map((k) => [k, Number(s.genderSplit[k]) || 0])
          .filter(([, v]) => v > 0)
          .sort((a, c) => c[1] - a[1])[0];
        if (top) parts.push(`${GENDER_META[top[0]].icon} ${top[1]}%`);
      }
      if (Array.isArray(s.ageRanges) && s.ageRanges.length) {
        const top = [...s.ageRanges].sort((a, c) => (Number(c.percent) || 0) - (Number(a.percent) || 0))[0];
        if (top && top.range) parts.push(`${top.range}: ${top.percent}%`);
      }
      if (Array.isArray(s.topCities) && s.topCities.length) {
        const top = [...s.topCities].sort((a, c) => (Number(c.percent) || 0) - (Number(a.percent) || 0))[0];
        if (top && top.city) parts.push(`${top.city} ${top.percent}%`);
      }
      return parts.join(' · ');
    }

    function audienceStatsFullText(b) {
      const s = b.audienceStats || {};
      const lines = [];
      if (s.genderSplit) {
        const bits = ['female', 'male', 'other'].filter((k) => s.genderSplit[k] != null).map((k) => `${GENDER_META[k].label} ${s.genderSplit[k]}%`);
        if (bits.length) lines.push('Gender: ' + bits.join(', '));
      }
      if (Array.isArray(s.ageRanges) && s.ageRanges.length) {
        lines.push('Age: ' + s.ageRanges.filter((r) => r.range).map((r) => `${r.range} ${r.percent || 0}%`).join(', '));
      }
      if (Array.isArray(s.topCities) && s.topCities.length) {
        lines.push('Audience cities: ' + s.topCities.filter((c) => c.city).map((c) => `${c.city} ${c.percent || 0}%`).join(', '));
      }
      return lines.join('\n');
    }

    function truncate(s, n) { if (!s) return '—'; return s.length > n ? s.slice(0, n) + '…' : s; }

    function bloggerStatusBadgeClass(status) {
      if (status === 'active') return 'badge-positive';
      if (status === 'archived') return 'badge-negative';
      return 'badge-warn';
    }

    /* No TrendHero/API access on the current plan, so follower/ER numbers are
       entered by hand. This can't auto-refresh, but it can nudge the admin to
       recheck old numbers — same traffic-light idea as deadlineUrgency() in
       ui.js, just measuring days *since* instead of days *until*. */
    function statsFreshness(iso) {
      if (!iso) return { cls: 'badge-warn', label: 'Never checked', days: Infinity };
      const days = Math.round((new Date() - new Date(iso)) / (1000 * 60 * 60 * 24));
      if (days > 90) return { cls: 'badge-negative', label: `Stale — ${days}d ago`, days };
      if (days > 45) return { cls: 'badge-warn', label: `Recheck soon — ${days}d ago`, days };
      return { cls: 'badge-positive', label: `Checked ${days}d ago`, days };
    }

    /* ---------------- Performance history (manual entries, source-ready for a future API) ---------------- */
    const PERF_PLATFORM_OPTIONS = ['Instagram', 'TikTok', 'YouTube', 'Other'];

    function bloggerHistory(bloggerId) {
      return (db.bloggerPerformanceHistory || [])
        .filter((h) => h.bloggerId === bloggerId)
        .sort((a, b) => new Date(b.postedAt || b.createdAt || 0) - new Date(a.postedAt || a.createdAt || 0));
    }

    /* Our own projects this blogger has been part of — pulled automatically
       from project_bloggers/projects, no manual entry needed (distinct from
       pastBrands, which covers brand work outside/before this platform). */
    function internalProjectHistory(bloggerId) {
      return (db.projectBloggers || [])
        .filter((pb) => pb.bloggerId === bloggerId)
        .map((pb) => {
          const p = (db.projects || []).find((x) => x.id === pb.projectId);
          return p ? { ...p, groupLabel: pb.groupLabel } : null;
        })
        .filter(Boolean)
        .sort((a, c) => new Date(c.startDate || c.createdAt || 0) - new Date(a.startDate || a.createdAt || 0));
    }

    function aiRecommendationsForBlogger(bloggerId) {
      return (db.aiRecommendations || [])
        .filter((r) => r.bloggerId === bloggerId)
        .sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
    }

    /* ---------------- Tabbed blogger card (History tab content) ---------------- */
    function bloggerHistoryTabHtml(b) {
      const entries = bloggerHistory(b.id);
      const internalProjects = internalProjectHistory(b.id);
      return `
        <h3 style="margin:0 0 6px;">Collaborations with our projects</h3>
        ${internalProjects.length === 0
          ? '<div class="small muted" style="margin-bottom:14px;">No internal project collaborations yet.</div>'
          : `<div style="margin-bottom:14px;">${internalProjects.map((p) => `
              <div class="card-row" style="align-items:center;padding:6px 0;border-bottom:1px solid var(--line-soft);">
                <div>
                  <strong>${escapeHtml(p.title || 'Untitled project')}</strong>
                  ${p.groupLabel ? `<span class="small muted"> · ${escapeHtml(p.groupLabel)}</span>` : ''}
                  <div class="small muted">${p.startDate ? formatDate(p.startDate) : '—'}</div>
                </div>
                ${badge(p.status)}
              </div>
            `).join('')}</div>`}

        <div style="margin-bottom:14px;">
          <div class="card-row" style="align-items:center;">
            <h4 style="margin:0;">Other brand collaborations</h4>
            <button class="btn btn-ghost btn-sm" onclick="toggleAddCollabRow('${b.id}')">+ Add collaboration</button>
          </div>
          <div style="margin-top:6px;">
            ${(b.pastBrands && b.pastBrands.length)
              ? b.pastBrands.map((x) => `<span class="tag" data-brand="${escapeHtml(x)}">${escapeHtml(x)} <span style="cursor:pointer;" title="Remove" onclick="removePastBrand('${b.id}', this.parentElement.dataset.brand)">✕</span></span>`).join(' ')
              : '<span class="small muted">No other collaborations added yet.</span>'}
          </div>
          <div id="add-collab-row-${b.id}" class="card-row" style="display:none;margin-top:8px;gap:8px;">
            <input id="new-collab-name-${b.id}" placeholder="Brand or collaboration name…" style="flex:1;" onkeydown="if(event.key==='Enter') addPastBrand('${b.id}')" />
            <button class="btn btn-secondary btn-sm" onclick="addPastBrand('${b.id}')">Add</button>
          </div>
        </div>

        <hr class="divider" style="margin:16px 0;" />
        <h3 style="margin:0 0 6px;">Performance history</h3>
        <div class="small muted" style="margin-bottom:10px;">Manual entries for now — add one per published video/post to track what's taking off over time.</div>
        <div class="grid grid-2">
          <div><label>Content link</label><input id="h-url" placeholder="https://instagram.com/reel/…" /></div>
          <div><label>Platform</label><select id="h-platform">${PERF_PLATFORM_OPTIONS.map((p) => `<option value="${p}">${p}</option>`).join('')}</select></div>
        </div>
        <div class="grid grid-2">
          <div><label>Posted date</label><input id="h-posted" type="date" /></div>
          <div><label>ER (%) <span class="muted small">(optional)</span></label><input id="h-er" type="number" step="0.01" /></div>
        </div>
        <label>Project <span class="muted small">(optional — tag it so this post's numbers count toward that campaign's report)</span></label>
        <select id="h-project">
          <option value="">— Not tied to a project —</option>
          ${internalProjects.map((p) => `<option value="${p.id}">${escapeHtml(p.title || 'Untitled project')}</option>`).join('')}
        </select>
        <div class="grid grid-3">
          <div><label>Views</label><input id="h-views" type="number" min="0" /></div>
          <div><label>Likes</label><input id="h-likes" type="number" min="0" /></div>
          <div><label>Comments</label><input id="h-comments" type="number" min="0" /></div>
        </div>
        <div><label>Shares</label><input id="h-shares" type="number" min="0" /></div>
        <label>Notes</label>
        <textarea id="h-notes" placeholder="Why it did (or didn't) work…"></textarea>
        <button class="btn btn-primary btn-block" style="margin-top:10px;" onclick="addPerformanceEntry('${b.id}')">+ Add entry</button>
        <hr class="divider" style="margin:18px 0;" />
        ${entries.length === 0
          ? '<div class="small muted">No entries yet.</div>'
          : entries.map((h) => `
            <div class="card-row" style="align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line-soft);">
              <div>
                <div><strong>${h.postedAt ? formatDate(h.postedAt) : '—'}</strong> <span class="muted small">${escapeHtml(h.platform || '')}</span>${h.projectId ? ` <span class="tag">${escapeHtml(((db.projects || []).find((p) => p.id === h.projectId) || {}).title || 'Project')}</span>` : ''}</div>
                <div class="small">${h.views != null ? `👁 ${Number(h.views).toLocaleString()}` : ''} ${h.likes != null ? `· ❤ ${Number(h.likes).toLocaleString()}` : ''} ${h.comments != null ? `· 💬 ${Number(h.comments).toLocaleString()}` : ''} ${h.er != null ? `· ER ${h.er}%` : ''}</div>
                ${h.contentUrl ? `<a class="small" href="${escapeHtml(h.contentUrl)}" target="_blank" rel="noopener">Open content</a>` : ''}
                ${h.notes ? `<div class="small muted" style="margin-top:4px;">${escapeHtml(h.notes)}</div>` : ''}
              </div>
              <button class="btn btn-ghost btn-sm" onclick="deletePerformanceEntry('${h.id}', '${b.id}')">✕</button>
            </div>
          `).join('')}
      `;
    }

    /* ---------------- Tabbed blogger card (AI recommendations tab content) ---------------- */
    const REC_STATUS_OPTIONS = ['draft', 'sent', 'archived'];

    function bloggerAiTabHtml(b) {
      const recs = aiRecommendationsForBlogger(b.id);
      return `
        <div class="small muted" style="margin-bottom:10px;">Uses this creator's profile + performance history + brand collaborations to suggest a content angle and short script.</div>
        <label>Project brief <span class="muted small">(optional)</span></label>
        <textarea id="h-brief" placeholder="Paste the brand/project brief here to tailor the recommendation…"></textarea>
        <button id="h-generate-btn" class="btn btn-primary btn-block" style="margin-top:10px;" onclick="generateScript('${b.id}')">✨ Generate script</button>
        ${recs.length === 0
          ? '<div class="small muted" style="margin-top:14px;">No recommendations generated yet.</div>'
          : recs.map((r) => `
            <div class="card-row" style="align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line-soft);margin-top:10px;">
              <div>
                <div class="small muted">${r.createdAt ? formatDate(r.createdAt) : ''} · ${escapeHtml(r.model || '')} · <span class="badge ${statusBadgeClass(r.status)}">${escapeHtml(statusLabel(r.status))}</span>${r.projectId ? ` · ${escapeHtml(((db.projects || []).find((p) => p.id === r.projectId) || {}).title || 'Project')}` : ''}</div>
                <div class="small" style="white-space:pre-wrap;margin-top:4px;">${escapeHtml(r.content)}</div>
                <div style="margin-top:6px;">
                  ${REC_STATUS_OPTIONS.filter((s) => s !== r.status).map((s) => `<button class="btn btn-ghost btn-sm" onclick="setRecommendationStatus('${r.id}', '${b.id}', '${s}')">Mark ${s}</button>`).join(' ')}
                </div>
              </div>
              <button class="btn btn-ghost btn-sm" onclick="deleteRecommendation('${r.id}', '${b.id}')">✕</button>
            </div>
          `).join('')}
      `;
    }

    async function generateScript(bloggerId) {
      const b = db.bloggerDirectory.find((x) => x.id === bloggerId);
      if (!b) return;
      const briefEl = document.getElementById('h-brief');
      const brief = briefEl ? briefEl.value.trim() : '';
      const btn = document.getElementById('h-generate-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Generating…'; }
      try {
        const payload = {
          blogger: {
            name: b.profileName,
            category: b.category || [],
            pastBrands: b.pastBrands || [],
            city: b.city || '',
            audienceCountry: (b.audienceCountries || [])[0] || '',
            followers: b.followersCount || null,
            er: b.engagementRate || null,
          },
          history: bloggerHistory(bloggerId).slice(0, 10).map((h) => ({
            platform: h.platform,
            views: h.views,
            likes: h.likes,
            comments: h.comments,
            er: h.er,
            notes: h.notes,
          })),
          brief: brief || undefined,
        };
        const res = await fetch('/api/generate-script', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
        const row = await dbInsert('aiRecommendations', {
          bloggerId,
          projectId: null,
          content: data.content,
          model: 'claude-opus-4-7',
          status: 'draft',
          createdAt: nowISO(),
        });
        db.aiRecommendations = db.aiRecommendations || [];
        db.aiRecommendations.push(row);
        toast('Script generated.');
      } catch (err) {
        console.error('generateScript failed:', err);
        toast('Could not generate: ' + (err && err.message ? err.message : 'unknown error'));
        return;
      } finally {
        renderBloggerCard();
      }
    }

    async function setRecommendationStatus(id, bloggerId, status) {
      try {
        const updated = await dbUpdate('aiRecommendations', id, { status });
        const idx = db.aiRecommendations.findIndex((x) => x.id === id);
        if (idx >= 0) db.aiRecommendations[idx] = updated;
        toast(`Marked as ${status}.`);
      } catch (err) {
        console.error('setRecommendationStatus failed:', err);
        toast('Could not update: ' + (err && err.message ? err.message : 'unknown error'));
        return;
      }
      renderBloggerCard();
    }

    async function deleteRecommendation(id, bloggerId) {
      if (!confirm('Delete this recommendation?')) return;
      try {
        await dbDelete('aiRecommendations', id);
        db.aiRecommendations = (db.aiRecommendations || []).filter((x) => x.id !== id);
        toast('Deleted.');
      } catch (err) {
        console.error('deleteRecommendation failed:', err);
        toast('Could not delete: ' + (err && err.message ? err.message : 'unknown error'));
        return;
      }
      renderBloggerCard();
    }

    /* ---------------- Manual "other brand collaborations" (self-reported, outside/before this platform) ---------------- */
    function toggleAddCollabRow(bloggerId) {
      const row = document.getElementById('add-collab-row-' + bloggerId);
      if (!row) return;
      const show = row.style.display === 'none';
      row.style.display = show ? 'flex' : 'none';
      if (show) {
        const input = document.getElementById('new-collab-name-' + bloggerId);
        if (input) input.focus();
      }
    }

    async function addPastBrand(bloggerId) {
      const input = document.getElementById('new-collab-name-' + bloggerId);
      const name = (input && input.value || '').trim();
      if (!name) return;
      try {
        const b = db.bloggerDirectory.find((x) => x.id === bloggerId);
        if (!b) return;
        const current = b.pastBrands || [];
        if (current.some((x) => x.toLowerCase() === name.toLowerCase())) {
          toast('Already added.');
          return;
        }
        const next = [...current, name];
        b.pastBrands = next;
        await dbUpdate('bloggerDirectory', bloggerId, { pastBrands: next });
      } catch (err) {
        console.error('addPastBrand failed:', err);
        toast('Could not save: ' + (err && err.message ? err.message : 'unknown error'));
      } finally {
        renderBloggerCard();
      }
    }

    async function removePastBrand(bloggerId, brand) {
      try {
        const b = db.bloggerDirectory.find((x) => x.id === bloggerId);
        if (!b) return;
        const next = (b.pastBrands || []).filter((x) => x !== brand);
        b.pastBrands = next;
        await dbUpdate('bloggerDirectory', bloggerId, { pastBrands: next });
      } catch (err) {
        console.error('removePastBrand failed:', err);
        toast('Could not remove: ' + (err && err.message ? err.message : 'unknown error'));
      } finally {
        renderBloggerCard();
      }
    }

    async function addPerformanceEntry(bloggerId) {
      try {
        const fields = {
          bloggerId,
          projectId: document.getElementById('h-project').value || null,
          contentUrl: document.getElementById('h-url').value.trim(),
          platform: document.getElementById('h-platform').value,
          postedAt: document.getElementById('h-posted').value || null,
          views: document.getElementById('h-views').value !== '' ? Number(document.getElementById('h-views').value) : 0,
          likes: document.getElementById('h-likes').value !== '' ? Number(document.getElementById('h-likes').value) : 0,
          comments: document.getElementById('h-comments').value !== '' ? Number(document.getElementById('h-comments').value) : 0,
          shares: document.getElementById('h-shares').value !== '' ? Number(document.getElementById('h-shares').value) : 0,
          er: document.getElementById('h-er').value !== '' ? Number(document.getElementById('h-er').value) : null,
          source: 'manual',
          notes: document.getElementById('h-notes').value.trim(),
          createdAt: nowISO(),
        };
        const row = await dbInsert('bloggerPerformanceHistory', fields);
        db.bloggerPerformanceHistory = db.bloggerPerformanceHistory || [];
        db.bloggerPerformanceHistory.push(row);
        toast('Entry added.');
      } catch (err) {
        console.error('addPerformanceEntry failed:', err);
        toast('Could not save: ' + (err && err.message ? err.message : 'unknown error'));
        return;
      }
      renderBloggerCard();
    }

    async function deletePerformanceEntry(id, bloggerId) {
      if (!confirm('Delete this entry?')) return;
      try {
        await dbDelete('bloggerPerformanceHistory', id);
        db.bloggerPerformanceHistory = (db.bloggerPerformanceHistory || []).filter((x) => x.id !== id);
        toast('Entry deleted.');
      } catch (err) {
        console.error('deletePerformanceEntry failed:', err);
        toast('Could not delete: ' + (err && err.message ? err.message : 'unknown error'));
        return;
      }
      renderBloggerCard();
    }

    /* ---------------- Tabbed blogger card (drawer) ---------------- */
    let bloggerCardState = { id: null, tab: 'profile' };

    function openBloggerCard(id, tab) {
      bloggerCardState = { id, tab: tab || 'profile' };
      renderBloggerCard();
    }

    function switchBloggerCardTab(tab) {
      bloggerCardState.tab = tab;
      renderBloggerCard();
    }

    function closeBloggerCard() {
      const root = document.getElementById('drawer-root');
      if (root) root.innerHTML = '';
    }

    function renderBloggerCard() {
      const { id, tab } = bloggerCardState;
      const b = id ? db.bloggerDirectory.find((x) => x.id === id) : null;
      const root = document.getElementById('drawer-root');
      if (!root) return;
      if (!b) { root.innerHTML = ''; return; }
      const tabContent = tab === 'history' ? bloggerHistoryTabHtml(b)
        : tab === 'ai' ? bloggerAiTabHtml(b)
        : bloggerFormFieldsHtml(b) + `<button class="btn btn-primary btn-block" style="margin-top:14px;" onclick="submitBloggerCard('${b.id}')">Save changes</button>`;
      root.innerHTML = `
        <div class="drawer-backdrop" onclick="if(event.target===this) closeBloggerCard()">
          <div class="drawer">
            <button class="modal-close" onclick="closeBloggerCard()">×</button>
            <h2 style="margin:0 0 4px;">${escapeHtml(b.profileName)}</h2>
            <div class="small muted" style="margin-bottom:14px;">
              ${b.instagramUrl ? `<a href="${escapeHtml(b.instagramUrl)}" target="_blank" rel="noopener">Instagram</a>` : ''}
              ${b.instagramUrl && b.tiktokUrl ? ' · ' : ''}
              ${b.tiktokUrl ? `<a href="${escapeHtml(b.tiktokUrl)}" target="_blank" rel="noopener">TikTok</a>` : ''}
            </div>
            <div class="tabs">
              <button class="${tab === 'profile' ? 'active' : ''}" onclick="switchBloggerCardTab('profile')">Profile</button>
              <button class="${tab === 'history' ? 'active' : ''}" onclick="switchBloggerCardTab('history')">History</button>
              <button class="${tab === 'ai' ? 'active' : ''}" onclick="switchBloggerCardTab('ai')">AI recommendations</button>
            </div>
            <div id="card-tab-content">${tabContent}</div>
            <hr class="divider" style="margin:20px 0 10px;" />
            <button class="btn btn-ghost btn-sm" onclick="deleteBlogger('${b.id}')">Delete blogger</button>
          </div>
        </div>`;
      if (tab === 'profile') setupBloggerFormDynamicRows(b);
    }

    async function submitBloggerCard(id) {
      try {
        const fields = readBloggerForm();
        if (!fields.profileName) fields.profileName = 'Untitled blogger';
        await reload();
        const updated = await dbUpdate('bloggerDirectory', id, fields);
        const idx = db.bloggerDirectory.findIndex((x) => x.id === id);
        if (idx >= 0) db.bloggerDirectory[idx] = updated;
        toast('Blogger updated.');
      } catch (err) {
        console.error('submitBloggerCard failed:', err);
        toast('Could not save: ' + (err && err.message ? err.message : 'unknown error'));
        return;
      }
      render();
      renderBloggerCard();
    }

    async function markStatsChecked(id) {
      await reload();
      const nowIso = nowISO();
      const updated = await dbUpdate('bloggerDirectory', id, { statsUpdatedAt: nowIso });
      const idx = db.bloggerDirectory.findIndex((x) => x.id === id);
      if (idx >= 0) db.bloggerDirectory[idx] = updated;
      toast('Marked as checked today.');
      render();
    }

    /* ---------------- render: sticky toolbar + tabs + table ---------------- */
    /* City grouping is case-insensitive on purpose — "Prague" and "prague"
       typed by different people must land in the same group, not fork into
       a second tab. The tab label shown is whichever casing was used most
       often, so one stray lowercase entry doesn't relabel the whole group
       either. */
    function groupKey(raw, fallback) { return ((raw && String(raw).trim()) || fallback).toLowerCase(); }

    function countByNormalized(list, key, fallback) {
      const variantsByKey = {};
      list.forEach((b) => {
        const raw = (b[key] && String(b[key]).trim()) || fallback;
        const nk = raw.toLowerCase();
        variantsByKey[nk] = variantsByKey[nk] || {};
        variantsByKey[nk][raw] = (variantsByKey[nk][raw] || 0) + 1;
      });
      const buckets = {};
      Object.entries(variantsByKey).forEach(([nk, variants]) => {
        const label = Object.entries(variants).sort((a, b) => b[1] - a[1])[0][0];
        const count = Object.values(variants).reduce((s, c) => s + c, 0);
        buckets[nk] = { label, count };
      });
      return buckets;
    }

    /* Builds the pick-list for the Add/Edit dropdowns: a few sensible
       defaults (in local spelling) plus whatever's already in the data
       (case-deduped), so a new city/language typed once becomes a real,
       reusable option for everyone from then on — no separate settings
       screen needed. */
    function buildOptionList(seedList, allRows, key, fallback) {
      const buckets = countByNormalized(allRows, key, fallback);
      const map = new Map();
      seedList.forEach((s) => map.set(s.toLowerCase(), s));
      Object.values(buckets).forEach(({ label }) => {
        if (label === fallback) return;
        const k = label.toLowerCase();
        if (!map.has(k)) map.set(k, label);
      });
      return [...map.values()].sort((a, b) => a.localeCompare(b));
    }

    function applyLightFilters(list) {
      return list.filter((b) => {
        if (originFilter.length) {
          const val = (b.audienceCountries || [])[0];
          const matches = val && (
            (originFilter.includes('OTHER') && !KNOWN_ORIGIN_CODES.includes(val)) ||
            originFilter.includes(val)
          );
          if (!matches) return false;
        }
        if (genderFilter.length && !genderFilter.includes(b.gender)) return false;
        if (filters.collabType && b.collabType !== filters.collabType) return false;
        if (filters.status && b.status !== filters.status) return false;
        return true;
      });
    }

    function render() {
      const all = db.bloggerDirectory;
      const q = filters.search.trim();

      document.getElementById('app').innerHTML = `
        <div class="db-toolbar" id="db-toolbar">
          <div class="card-row" style="align-items:center;flex-wrap:wrap;gap:10px;">
            <h1 style="margin:0;">Blogger Database</h1>
            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
              <input id="f-search" style="width:220px;" placeholder="Search name, email, IG…" value="${escapeHtml(filters.search)}" oninput="onSearchChange(this.value)" />
              <button class="btn btn-secondary btn-sm" onclick="openImportCSV()">Import CSV</button>
              <button class="btn btn-secondary btn-sm" onclick="exportCSV()">Export CSV</button>
              <button class="btn btn-primary btn-sm" onclick="openBloggerModal()">+ Add Blogger</button>
            </div>
          </div>
          ${q ? '' : renderCityTabs(all)}
        </div>
        <div style="margin-top:14px;">
          ${q ? renderSearchResults(all, q) : renderTabbedView(all)}
        </div>
      `;

      const toolbar = document.getElementById('db-toolbar');
      const navEl = document.getElementById('nav');
      if (toolbar && navEl) toolbar.style.top = navEl.offsetHeight + 'px';

      if (q) {
        const el = document.getElementById('f-search');
        if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      }
    }

    function renderCityTabs(all) {
      const buckets = countByNormalized(all, 'city', 'No city set');
      const keys = Object.keys(buckets).sort((a, b) => buckets[a].label.localeCompare(buckets[b].label));
      if (activeCity && !keys.includes(activeCity)) activeCity = null;
      const tabs = ['', ...keys];
      return `<div class="tabs" style="margin:10px 0 0;">
        ${tabs.map((k) => {
          const isAll = k === '';
          const label = isAll ? `All cities <span class="muted small">(${all.length})</span>` : `${escapeHtml(buckets[k].label)} <span class="muted small">(${buckets[k].count})</span>`;
          const isActive = isAll ? !activeCity : k === activeCity;
          return `<button class="${isActive ? 'active' : ''}" data-city="${escapeHtml(k)}" onclick="setCityTab(this.dataset.city)">${label}</button>`;
        }).join('')}
      </div>`;
    }

    function setCityTab(city) { activeCity = city || null; render(); }

    function onSearchChange(value) { filters.search = value; render(); }
    function onFilterChange(key, value) { filters[key] = value; render(); }
    function clearLightFilters() { originFilter = []; genderFilter = []; filters.collabType = ''; filters.status = ''; render(); }

    function toggleOriginFilter(el) {
      el.classList.toggle('selected');
      originFilter = [...document.querySelectorAll('#origin-filter-chips .chip.selected')].map((c) => c.dataset.origin);
      render();
    }

    function toggleGenderFilter(el) {
      el.classList.toggle('selected');
      genderFilter = [...document.querySelectorAll('#gender-filter-chips .chip.selected')].map((c) => c.dataset.gender);
      render();
    }

    function setSortBy(value) {
      sortBy = value;
      render();
    }

    function renderQuickFilters() {
      return `
        <div style="display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line-soft);">
          <div>
            <div class="small muted" style="margin-bottom:5px;font-weight:600;">Nationality</div>
            <div class="chip-select" id="origin-filter-chips">
              ${ORIGIN_OPTIONS.map((c) => `<div class="chip ${originFilter.includes(c) ? 'selected' : ''}" data-origin="${c}" onclick="toggleOriginFilter(this)">${originMeta(c).flag} ${originMeta(c).label}</div>`).join('')}
            </div>
          </div>
          <div>
            <div class="small muted" style="margin-bottom:5px;font-weight:600;">Gender</div>
            <div class="chip-select" id="gender-filter-chips">
              ${GENDER_OPTIONS.map((g) => `<div class="chip ${genderFilter.includes(g) ? 'selected' : ''}" data-gender="${g}" onclick="toggleGenderFilter(this)">${GENDER_META[g].icon} ${GENDER_META[g].label}</div>`).join('')}
            </div>
          </div>
          <div>
            <div class="small muted" style="margin-bottom:5px;font-weight:600;">Type</div>
            <select style="width:auto;" onchange="onFilterChange('collabType', this.value)">
              <option value="">All</option>
              ${Object.entries(COLLAB_TYPE_LABELS).map(([k, v]) => `<option value="${k}" ${filters.collabType === k ? 'selected' : ''}>${v}</option>`).join('')}
            </select>
          </div>
          <div>
            <div class="small muted" style="margin-bottom:5px;font-weight:600;">Status</div>
            <select style="width:auto;" onchange="onFilterChange('status', this.value)">
              <option value="">All</option>
              ${Object.entries(STATUS_LABELS_LOCAL).map(([k, v]) => `<option value="${k}" ${filters.status === k ? 'selected' : ''}>${v}</option>`).join('')}
            </select>
          </div>
          <div>
            <div class="small muted" style="margin-bottom:5px;font-weight:600;">Sort by</div>
            <select style="width:auto;" onchange="setSortBy(this.value)">
              <option value="name" ${sortBy === 'name' ? 'selected' : ''}>Alphabetical (A–Z)</option>
              <option value="followers" ${sortBy === 'followers' ? 'selected' : ''}>Followers (high→low)</option>
              <option value="er" ${sortBy === 'er' ? 'selected' : ''}>Best ER (high→low)</option>
              <option value="newest" ${sortBy === 'newest' ? 'selected' : ''}>Date added (newest first)</option>
              <option value="oldest" ${sortBy === 'oldest' ? 'selected' : ''}>Date added (oldest first)</option>
            </select>
          </div>
          ${(originFilter.length || genderFilter.length || filters.collabType || filters.status) ? '<button class="btn btn-ghost btn-sm" onclick="clearLightFilters()">Clear filters</button>' : ''}
        </div>
      `;
    }

    function renderTabbedView(all) {
      const cityScoped = activeCity ? all.filter((b) => groupKey(b.city, 'No city set') === activeCity) : all;
      const rows = applyLightFilters(cityScoped);

      return `
        <div class="card" style="margin-bottom:0;">
          ${renderQuickFilters()}
          ${rows.length === 0
            ? `<div class="empty-state"><p>No bloggers match this view yet.</p><button class="btn btn-primary btn-sm" onclick="openBloggerModal()">+ Add blogger</button></div>`
            : bloggerTable(rows)}
        </div>
      `;
    }

    function renderSearchResults(all, q) {
      const needle = q.trim().toLowerCase();
      const rows = applyLightFilters(all).filter((b) => {
        const hay = `${b.profileName || ''} ${b.email || ''} ${b.instagramUrl || ''} ${b.tiktokUrl || ''} ${b.city || ''}`.toLowerCase();
        return hay.includes(needle);
      });
      return `
        <div class="card">
          <div class="card-row" style="align-items:center;margin-bottom:10px;">
            <h3 style="margin:0;">Search results <span class="muted small">(${rows.length})</span></h3>
            <button class="btn btn-ghost btn-sm" onclick="onSearchChange('')">✕ Clear search</button>
          </div>
          ${renderQuickFilters()}
          ${rows.length === 0 ? '<div class="empty-state"><p>Nothing found.</p></div>' : bloggerTable(rows)}
        </div>
      `;
    }

    const SORT_COMPARATORS = {
      name: (a, b) => (a.profileName || '').localeCompare(b.profileName || '', undefined, { sensitivity: 'base' }),
      followers: (a, b) => (b.followersCount ?? -1) - (a.followersCount ?? -1),
      er: (a, b) => (b.engagementRate ?? -1) - (a.engagementRate ?? -1),
      newest: (a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0),
      oldest: (a, b) => new Date(a.createdAt || 0) - new Date(b.createdAt || 0),
    };

    function bloggerTable(list) {
      const sorted = [...list].sort(SORT_COMPARATORS[sortBy] || SORT_COMPARATORS.name);
      return `<div class="table-scroll"><table>
        <thead><tr><th>Profile</th><th>Email</th><th>Niche</th><th>Tags</th><th>Audience</th><th>Followers</th><th>ER</th><th>Avg reach</th><th>Type</th><th>Status</th><th>Freshness</th><th>Terms / notes</th><th></th></tr></thead>
        <tbody>
        ${sorted.map((b) => {
          const fresh = statsFreshness(b.statsUpdatedAt);
          const initial = (b.profileName || '?').trim().charAt(0).toUpperCase() || '?';
          const origin = (b.audienceCountries || [])[0] || null;
          const om = origin ? originMeta(origin) : null;
          const gm = b.gender ? GENDER_META[b.gender] : null;
          return `
          <tr onclick="openBloggerCard('${b.id}')" style="cursor:pointer;">
            <td>
              <div style="display:flex;align-items:center;gap:10px;">
                <div class="avatar" style="width:30px;height:30px;font-size:12.5px;flex-shrink:0;${om ? `background:${om.color};` : ''}">${escapeHtml(initial)}</div>
                <div>
                  <strong>${escapeHtml(b.profileName)}</strong>
                  <div class="small muted">
                    ${b.instagramUrl ? `<a href="${escapeHtml(b.instagramUrl)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Instagram</a>` : ''}
                    ${b.instagramUrl && b.tiktokUrl ? ' · ' : ''}
                    ${b.tiktokUrl ? `<a href="${escapeHtml(b.tiktokUrl)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">TikTok</a>` : ''}
                  </div>
                </div>
              </div>
            </td>
            <td class="small">${escapeHtml(b.email || '—')}</td>
            <td class="small" style="max-width:130px;">${(b.category || []).length ? (b.category || []).map((c) => `<span class="tag">${escapeHtml(c)}</span>`).join(' ') : '<span class="muted">—</span>'}</td>
            <td style="white-space:nowrap;">
              ${om ? `<span class="badge" style="background:${om.bg};color:${om.color};" title="${escapeHtml(om.label)}">${om.flag} ${escapeHtml(origin)}</span>` : '<span class="muted small">—</span>'}
              ${gm ? `<span class="badge" style="background:${gm.bg};color:${gm.color};margin-left:3px;">${gm.icon}</span>` : ''}
            </td>
            <td class="small" style="max-width:170px;" title="${escapeHtml(audienceStatsFullText(b))}">${audienceStatsSummary(b) ? escapeHtml(audienceStatsSummary(b)) : '<span class="muted">—</span>'}</td>
            <td>${b.followersCount != null ? Number(b.followersCount).toLocaleString() : '—'}</td>
            <td>${b.engagementRate != null ? b.engagementRate + '%' : '—'}</td>
            <td>${b.avgReach90d != null ? Number(b.avgReach90d).toLocaleString() : '—'}</td>
            <td>
              ${escapeHtml(COLLAB_TYPE_LABELS[b.collabType] || b.collabType)}
              ${(b.reelPrice != null || b.storyPrice != null) ? `<div class="small muted" style="white-space:nowrap;">${b.reelPrice != null ? `Reel ${Number(b.reelPrice).toLocaleString()}` : ''}${b.reelPrice != null && b.storyPrice != null ? ' · ' : ''}${b.storyPrice != null ? `Story ${Number(b.storyPrice).toLocaleString()}` : ''}</div>` : ''}
            </td>
            <td><span class="badge ${bloggerStatusBadgeClass(b.status)}">${escapeHtml(STATUS_LABELS_LOCAL[b.status] || b.status)}</span></td>
            <td>
              <span class="badge ${fresh.cls}">${fresh.label}</span><br/>
              <button class="btn btn-ghost btn-sm" style="margin-top:4px;" onclick="event.stopPropagation(); markStatsChecked('${b.id}')">Mark checked</button>
            </td>
            <td class="small" style="max-width:180px;" title="${escapeHtml(b.termsNotes || '')}">${escapeHtml(truncate(b.termsNotes, 40))}</td>
            <td class="small muted" style="text-align:right;">›</td>
          </tr>
        `;
        }).join('')}
        </tbody>
      </table></div>`;
    }

    /* ---------------- Add / Edit modal (create-only now — editing an existing
       blogger happens inside the tabbed card, see openBloggerCard below) ---------------- */

            <input id="b-past-brands" value="${b ? escapeHtml((b.pastBrands || []).join(', ')) : ''}" placeholder="e.g. Nike, Zara, Redbull" />
            <div class="grid grid-3">
              <div><label>Followers</label><input id="b-followers" type="number" value="${b && b.followersCount != null ? b.followersCount : ''}" /></div>

              <div style="margin-top:8px;">

                  <div><input id="b-aud-gender-male" type="number" min="0" max="100" placeholder="♂ Male %" value="${b && b.audienceStats && b.audienceStats.genderSplit && b.audienceStats.genderSplit.male != null ? b.audienceStats.genderSplit.male : ''}" /></div>
                  <div><input id="b-aud-gender-other" type="number" min="0" max="100" placeholder="Other %" value="${b && b.audienceStats && b.audienceStats.genderSplit && b.audienceStats.genderSplit.other != null ? b.audienceStats.genderSplit.other : ''}" /></div>

            <textarea id="b-audience" placeholder="Anything else — spending power, brand affinity, past collab feedback…">${b ? escapeHtml(b.audienceNotes || '') : ''}</textarea>
            <label>City <span class="field-hint" style="display:inline;">(pick from the list so casing always matches — "Prague" and "prague" would otherwise split into two groups)</span></label>
            <select id="b-city-select" onchange="onNewOptionToggle('city', this.value)">
              <option value="">— Select city —</option>
              ${cityOptions.map((c) => `<option value="${escapeHtml(c)}" ${b && b.city && b.city.trim().toLowerCase() === c.toLowerCase() ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('')}
              <option value="__new__" ${cityIsCustom ? 'selected' : ''}>+ Add new city…</option>

            <label>Nationality <span class="field-hint" style="display:inline;">(who the blogger themself is — not their audience; click again to clear)</span></label>
            <div class="chip-select" id="audience-chips">
              ${KNOWN_ORIGIN_CODES.map((c) => `<div class="chip ${storedOrigin === c ? 'selected' : ''}" data-country="${c}" onclick="selectOriginChip(this)">${originMeta(c).flag} ${c}</div>`).join('')}

    /* Populates the dynamic audience-data rows after bloggerFormFieldsHtml(b)
       has been injected into the DOM — must run post-render since it reads
       the just-created #b-aud-age-rows / #b-aud-city-rows containers. */
    function setupBloggerFormDynamicRows(b) {
      const savedAgeRanges = (b && b.audienceStats && Array.isArray(b.audienceStats.ageRanges) && b.audienceStats.ageRanges.length) ? b.audienceStats.ageRanges : [{}];
      savedAgeRanges.forEach((r) => addAudienceAgeRow(r.range || '', r.percent != null ? r.percent : ''));
      const savedTopCities = (b && b.audienceStats && Array.isArray(b.audienceStats.topCities) && b.audienceStats.topCities.length) ? b.audienceStats.topCities : [{}];
      savedTopCities.forEach((r) => addAudienceCityRow(r.city || '', r.percent != null ? r.percent : ''));
    }

    function openBloggerModal() {
      /* Create-only now — editing an existing blogger happens inside the
         tabbed card (openBloggerCard), which shares these same form fields. */
      document.getElementById('modal-root').innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
          <div class="modal">
            <button class="modal-close" onclick="closeModal()">×</button>
            <h2>Add blogger</h2>
            ${bloggerFormFieldsHtml(null)}
            <button class="btn btn-primary btn-block" style="margin-top:14px;" onclick="submitBlogger(null)">Add blogger</button>
          </div>
        </div>`;
      setupBloggerFormDynamicRows(null);
    }

    /* Dynamic add/remove rows for the "Audience data" block — kept as plain
       DOM manipulation (not re-rendering the whole modal template) so typing
       in one row never disturbs the others or loses focus. */
    function addAudienceAgeRow(range, percent) {
      const container = document.getElementById('b-aud-age-rows');
      if (!container) return;
      const row = document.createElement('div');
      row.className = 'audience-row';
      row.style.cssText = 'display:flex;gap:8px;margin-bottom:6px;align-items:center;';
      row.innerHTML = `
        <select class="aud-age-select" style="flex:1;">
          <option value="">— Age range —</option>
          ${AUDIENCE_AGE_BRACKETS.map((r) => `<option value="${r}" ${range === r ? 'selected' : ''}>${r}</option>`).join('')}
        </select>
        <input type="number" class="aud-age-percent" placeholder="%" min="0" max="100" style="width:80px;" value="${percent != null && percent !== '' ? percent : ''}" />
        <button type="button" class="btn btn-ghost btn-sm" onclick="this.parentElement.remove()">✕</button>
      `;
      container.appendChild(row);
    }

    function addAudienceCityRow(city, percent) {
      const container = document.getElementById('b-aud-city-rows');
      if (!container) return;
      const row = document.createElement('div');
      row.className = 'audience-row';
      row.style.cssText = 'display:flex;gap:8px;margin-bottom:6px;align-items:center;';
      row.innerHTML = `
        <input class="aud-city-name" placeholder="City" style="flex:1;" value="${city ? escapeHtml(city) : ''}" />
        <input type="number" class="aud-city-percent" placeholder="%" min="0" max="100" style="width:80px;" value="${percent != null && percent !== '' ? percent : ''}" />
        <button type="button" class="btn btn-ghost btn-sm" onclick="this.parentElement.remove()">✕</button>
      `;
      container.appendChild(row);
    }

    /* Blogger nationality is either/or — selecting one clears the others.
       Clicking the already-selected chip clears it back to "unset".
       Picking "Other" reveals a free-text field for anything outside the
       five common markets. */
    function selectOriginChip(el) {
      const wasSelected = el.classList.contains('selected');
      [...el.parentElement.children].forEach((c) => c.classList.remove('selected'));
      if (!wasSelected) el.classList.add('selected');
      const wrap = document.getElementById('b-origin-other-wrap');
      if (wrap) {
        const showOther = !wasSelected && el.dataset.country === 'OTHER';
        wrap.style.display = showOther ? 'block' : 'none';
        if (!showOther) document.getElementById('b-origin-other').value = '';
      }
    }

    function selectGenderChip(el) {
      const wasSelected = el.classList.contains('selected');
      [...el.parentElement.children].forEach((c) => c.classList.remove('selected'));
      if (!wasSelected) el.classList.add('selected');
    }

    /* Shows the free-text box when "+ Add new city/language…" is picked. */
    function onNewOptionToggle(kind, value) {
      const wrap = document.getElementById(`b-${kind}-new-wrap`);
      if (wrap) wrap.style.display = value === '__new__' ? 'block' : 'none';
    }

    /* Reel/story rates only make sense once money is involved — hidden for
       pure barter, shown for "paid" and "barter or paid". */
    function toggleRatesVisibility(collabType) {
      const wrap = document.getElementById('b-rates-wrap');
      if (wrap) wrap.style.display = (collabType === 'paid' || collabType === 'both') ? 'block' : 'none';
    }

    function readBloggerForm() {
      const originEl = document.querySelector('#audience-chips .chip.selected');
      let audienceCountries = [];
      if (originEl) {
        if (originEl.dataset.country === 'OTHER') {
          const custom = document.getElementById('b-origin-other').value.trim();
          if (custom) audienceCountries = [custom];
        } else {
          audienceCountries = [originEl.dataset.country];
        }
      }
      const genderEl = document.querySelector('#gender-chips .chip.selected');
      const citySelect = document.getElementById('b-city-select').value;
      const city = citySelect === '__new__' ? document.getElementById('b-city-new').value.trim() : citySelect;

      const ageRanges = [...document.querySelectorAll('#b-aud-age-rows .audience-row')]
        .map((row) => ({
          range: row.querySelector('.aud-age-select').value,
          percent: row.querySelector('.aud-age-percent').value !== '' ? Number(row.querySelector('.aud-age-percent').value) : null,
        }))
        .filter((r) => r.range && r.percent != null);
      const topCities = [...document.querySelectorAll('#b-aud-city-rows .audience-row')]
        .map((row) => ({
          city: row.querySelector('.aud-city-name').value.trim(),
          percent: row.querySelector('.aud-city-percent').value !== '' ? Number(row.querySelector('.aud-city-percent').value) : null,
        }))
        .filter((r) => r.city && r.percent != null);
      const genderSplit = {};
      const gf = document.getElementById('b-aud-gender-female').value;
      const gmv = document.getElementById('b-aud-gender-male').value;
      const go = document.getElementById('b-aud-gender-other').value;
      if (gf !== '') genderSplit.female = Number(gf);
      if (gmv !== '') genderSplit.male = Number(gmv);
      if (go !== '') genderSplit.other = Number(go);
      const audienceStats = {};
      if (ageRanges.length) audienceStats.ageRanges = ageRanges;
      if (topCities.length) audienceStats.topCities = topCities;
      if (Object.keys(genderSplit).length) audienceStats.genderSplit = genderSplit;

      return {
        profileName: document.getElementById('b-name').value.trim(),
        instagramUrl: document.getElementById('b-instagram').value.trim(),
        tiktokUrl: document.getElementById('b-tiktok').value.trim(),
        email: document.getElementById('b-email').value.trim(),
        category: document.getElementById('b-category').value.split(',').map((s) => s.trim()).filter(Boolean),
        pastBrands: document.getElementById('b-past-brands').value.split(',').map((s) => s.trim()).filter(Boolean),
        followersCount: document.getElementById('b-followers').value ? Number(document.getElementById('b-followers').value) : null,
        engagementRate: document.getElementById('b-er').value ? Number(document.getElementById('b-er').value) : null,
        avgReach90d: document.getElementById('b-reach').value ? Number(document.getElementById('b-reach').value) : null,
        audienceNotes: document.getElementById('b-audience').value.trim(),
        city,
        audienceCountries,
        audienceStats,
        gender: genderEl ? genderEl.dataset.gender : null,
        collabType: document.getElementById('b-collabtype').value,
        reelPrice: document.getElementById('b-reel-price').value !== '' ? Number(document.getElementById('b-reel-price').value) : null,
        storyPrice: document.getElementById('b-story-price').value !== '' ? Number(document.getElementById('b-story-price').value) : null,
        status: document.getElementById('b-status').value,
        termsNotes: document.getElementById('b-terms').value.trim(),
      };
    }

    async function submitBlogger(id) {
      try {
        const fields = readBloggerForm();
        /* No field is mandatory anymore — you can save a near-blank row and
           fill in the rest later. A totally nameless row would be impossible
           to find again, so it gets a placeholder name instead of being
           blocked. */
        if (!fields.profileName) fields.profileName = 'Untitled blogger';
        await reload();
        if (id) {
          const updated = await dbUpdate('bloggerDirectory', id, fields);
          const idx = db.bloggerDirectory.findIndex((x) => x.id === id);
          if (idx >= 0) db.bloggerDirectory[idx] = updated;
          toast('Blogger updated.');
        } else {
          const row = await dbInsert('bloggerDirectory', { ...fields, statsUpdatedAt: null, createdAt: nowISO() });
          db.bloggerDirectory.push(row);
          toast('Blogger added.');
        }
      } catch (err) {
        /* Previously a failed save here (including a bad read of the form
           itself) just did nothing visible — the error vanished into the
           console, which looked exactly like the button not working at
           all. Now it's surfaced so the real cause is obvious. */
        console.error('submitBlogger failed:', err);
        toast('Could not save: ' + (err && err.message ? err.message : 'unknown error'));
        return;
      }
      closeModal();
      render();
    }

    async function deleteBlogger(id) {
      if (!confirm('Remove this blogger from the database? This cannot be undone.')) return;
      await reload();
      await dbDelete('bloggerDirectory', id);
      db.bloggerDirectory = db.bloggerDirectory.filter((x) => x.id !== id);
      toast('Blogger removed.');
      closeBloggerCard();
      render();
    }

    function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

    /* ---------------- CSV import (migrating the existing Excel sheet) ---------------- */
    const CSV_FIELD_ALIASES = {
      profileName: ['profilename', 'name', 'имя', 'profile', 'blogger'],
      instagramUrl: ['instagramurl', 'instagram', 'ig'],
      tiktokUrl: ['tiktokurl', 'tiktok', 'tt'],
      email: ['email', 'e-mail', 'почта', 'имейл'],
      followersCount: ['followerscount', 'followers', 'подписчики'],
      engagementRate: ['engagementrate', 'er', 'engagement'],
      avgReach90d: ['avgreach90d', 'reach', 'avgreach', 'охват'],
      audienceNotes: ['audiencenotes', 'audience', 'аудитория'],
      city: ['city', 'город'],
      audienceCountries: ['origin', 'nationality', 'bloggerorigin', 'ru/ua', 'ruua', 'национальность', 'происхождение', 'страна'],
      gender: ['gender', 'sex', 'пол'],
      collabType: ['collabtype', 'type', 'бартер/оплата', 'collab'],
      reelPrice: ['reelprice', 'reel', 'reelrate', 'цена рилс', 'рилс'],
      storyPrice: ['storyprice', 'story', 'storyrate', 'цена сторис', 'сторис'],
      termsNotes: ['termsnotes', 'terms', 'notes', 'условия', 'заметки'],
      status: ['status', 'статус'],
    };

    function normalizeHeader(h) {
      return h.trim().toLowerCase().replace(/[\s_]+/g, '');
    }

    /* Maps loose spreadsheet text to a known origin code where possible,
       otherwise keeps the original text as a custom nationality. */
    function normalizeOriginToken(raw) {
      const t = raw.trim();
      const low = t.toLowerCase();
      if (['ru', 'russian', 'русский', 'россия', 'рус'].includes(low)) return 'RU';
      if (['ua', 'ukrainian', 'украинский', 'украина', 'укр'].includes(low)) return 'UA';
      if (['cz', 'czech', 'чех', 'чешский', 'чехия'].includes(low)) return 'CZ';
      if (['sk', 'slovak', 'словак', 'словацкий', 'словакия'].includes(low)) return 'SK';
      if (['en', 'english', 'англ', 'англоязычный', 'international'].includes(low)) return 'EN';
      return t;
    }

    function normalizeGenderToken(raw) {
      const low = raw.trim().toLowerCase();
      if (['m', 'male', 'м', 'муж', 'мужчина'].includes(low)) return 'male';
      if (['f', 'female', 'ж', 'жен', 'женщина'].includes(low)) return 'female';
      if (low) return 'other';
      return null;
    }

    function parseCSVLine(line) {
      const out = [];
      let cur = '', inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (inQuotes) {
          if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; }
          else if (ch === '"') { inQuotes = false; }
          else { cur += ch; }
        } else if (ch === '"') { inQuotes = true; }
        else if (ch === ',' || ch === '\t') { out.push(cur); cur = ''; }
        else { cur += ch; }
      }
      out.push(cur);
      return out.map((s) => s.trim());
    }

    function openImportCSV() {
      document.getElementById('modal-root').innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
          <div class="modal">
            <button class="modal-close" onclick="closeModal()">×</button>
            <h2>Import from Excel / CSV</h2>
            <p class="small muted">Copy the rows from your Excel sheet (including the header row) and paste them below — comma or tab separated both work. Recognized columns: profile name, Instagram, TikTok, email, followers, ER, avg reach, audience notes, city, nationality (RU/UA/CZ/SK/EN or free text — the blogger themself, not their audience), gender (male/female), collab type (barter/paid/both), reel price, story price, terms/notes, status.</p>
            <textarea id="csv-input" rows="10" placeholder="Name, Instagram, City, Language...&#10;Anna K., https://instagram.com/annak, Prague, Русский..."></textarea>
            <button class="btn btn-primary btn-block" style="margin-top:14px;" onclick="submitImportCSV()">Import rows</button>
          </div>
        </div>`;
    }

    async function submitImportCSV() {
      const raw = document.getElementById('csv-input').value;
      const lines = raw.split(/\r?\n/).filter((l) => l.trim().length);
      if (lines.length < 2) { toast('Paste a header row plus at least one data row.'); return; }
      const headers = parseCSVLine(lines[0]).map(normalizeHeader);
      const colMap = headers.map((h) => {
        const match = Object.entries(CSV_FIELD_ALIASES).find(([, aliases]) => aliases.includes(h));
        return match ? match[0] : null;
      });
      if (!colMap.includes('profileName')) { toast('Could not find a "name" column — check the header row.'); return; }

      const newRows = lines.slice(1).map((line) => {
        const cells = parseCSVLine(line);
        const obj = { collabType: 'barter', status: 'active', statsUpdatedAt: null, createdAt: nowISO() };
        colMap.forEach((field, i) => {
          if (!field || cells[i] === undefined || cells[i] === '') return;
          if (['followersCount', 'avgReach90d', 'reelPrice', 'storyPrice'].includes(field)) obj[field] = Number(cells[i].replace(/[^\d.-]/g, '')) || null;
          else if (field === 'engagementRate') obj[field] = Number(cells[i].replace(/[^\d.-]/g, '')) || null;
          else if (field === 'audienceCountries') {
            const first = cells[i].split(/[/,;]+/).map((s) => s.trim()).filter(Boolean)[0];
            obj[field] = first ? [normalizeOriginToken(first)] : [];
          }
          else if (field === 'gender') obj[field] = normalizeGenderToken(cells[i]);
          else obj[field] = cells[i];
        });
        return obj;
      }).filter((o) => o.profileName);

      if (newRows.length === 0) { toast('No valid rows found.'); return; }
      await reload();

      /* Snap city casing to whatever's already canonical in the database (or
         the seed list), so a bulk CSV import doesn't spawn its own "Prague"
         vs "prague" duplicate the way manual typing did. */
      const cityCanon = buildOptionList(CITY_SUGGESTIONS, db.bloggerDirectory, 'city', 'No city set');
      newRows.forEach((r) => {
        if (r.city) { const m = cityCanon.find((c) => c.toLowerCase() === r.city.toLowerCase()); if (m) r.city = m; }
      });

      const inserted = await dbInsertMany('bloggerDirectory', newRows);
      db.bloggerDirectory.push(...inserted);
      await logActivity(db, { userId: user.id, entityType: 'blogger_directory', entityId: null, action: `Imported ${inserted.length} bloggers from CSV` });
      closeModal();
      toast(`Imported ${inserted.length} blogger${inserted.length === 1 ? '' : 's'}.`);
      render();
    }

    /* ---------------- CSV export ---------------- */
    function exportCSV() {
      const rows = applyLightFilters(db.bloggerDirectory);
      const header = ['Profile name', 'Instagram', 'TikTok', 'Email', 'Followers', 'ER (%)', 'Avg reach (90d)', 'Audience notes', 'City', 'Nationality', 'Gender', 'Collab type', 'Reel price', 'Story price', 'Status', 'Terms / notes'];
      const body = rows.map((b) => [
        b.profileName, b.instagramUrl, b.tiktokUrl, b.email, b.followersCount, b.engagementRate, b.avgReach90d,
        b.audienceNotes, b.city, (b.audienceCountries || []).join('/'), b.gender || '', COLLAB_TYPE_LABELS[b.collabType] || b.collabType, b.reelPrice != null ? b.reelPrice : '', b.storyPrice != null ? b.storyPrice : '', STATUS_LABELS_LOCAL[b.status] || b.status, b.termsNotes,
      ]);
      const csv = [header, ...body].map((r) => r.map((v) => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'blogger_database.csv';
      a.click();
    }
  </script>
