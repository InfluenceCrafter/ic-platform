<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Profile — InfluenceCrafter Creator Hub</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav id="nav"></nav>
  <div class="page narrow" id="app"></div>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    const ctx = requireRole(['creator']);
    let db, user, profile;
    const ALL_CATEGORIES = ['Food', 'Lifestyle', 'Beauty', 'Fashion', 'Travel', 'Wellness', 'Fitness', 'Family', 'Parenting', 'Student life', 'Local Prague', 'Luxury', 'Events', 'UGC creator', 'Photography', 'Video production', 'Other'];

    if (ctx) {
      db = ctx.db; user = ctx.user; profile = currentCreatorProfile(db, user);
      renderNav('profile.html');
      render();
    }

    function render() {
      const completeness = profileCompleteness(profile);
      document.getElementById('app').innerHTML = `
        <h1>My Profile</h1>
        <div class="card">
          <div class="progress-bar"><div style="width:${completeness.pct}%"></div></div>
          <p class="small" style="margin-top:8px;">Profile ${completeness.pct}% complete${completeness.missing.length ? ' — missing: ' + completeness.missing.join(', ') : ''}</p>
        </div>

        <form id="profile-form">
          <div class="card">
            <h3>Basic information</h3>
            <label>First name</label><input id="p-first" value="${escapeHtml(user.firstName)}" />
            <label>Last name</label><input id="p-last" value="${escapeHtml(user.lastName)}" />
            <label>Email</label><input value="${escapeHtml(user.email)}" disabled />
            <label>Phone</label><input id="p-phone" value="${escapeHtml(profile.phone || '')}" />
            <div class="grid grid-2">
              <div><label>City</label><input id="p-city" value="${escapeHtml(profile.city || '')}" /></div>
              <div><label>Country</label><input id="p-country" value="${escapeHtml(profile.country || '')}" /></div>
            </div>
          </div>

          <div class="card">
            <h3>Social media</h3>
            <label>Instagram username</label><input id="p-ig" value="${escapeHtml(profile.instagramUsername || '')}" />
            <div class="grid grid-2">
              <div><label>Followers</label><input type="number" id="p-ig-followers" value="${profile.social.instagram.followers || 0}" /></div>
              <div><label>Engagement rate (%)</label><input type="number" step="0.1" id="p-ig-eng" value="${profile.social.instagram.engagementRate || 0}" /></div>
            </div>
            <div class="grid grid-2">
              <div><label>Avg. reel views</label><input type="number" id="p-ig-reel" value="${profile.social.instagram.avgReelViews || 0}" /></div>
              <div><label>Avg. story views</label><input type="number" id="p-ig-story" value="${profile.social.instagram.avgStoryViews || 0}" /></div>
            </div>
            <hr class="divider" />
            <label>TikTok username</label><input id="p-tiktok" value="${escapeHtml(profile.tiktokUsername || '')}" />
            <label>TikTok followers</label><input type="number" id="p-tiktok-followers" value="${profile.social.tiktok.followers || 0}" />
          </div>

          <div class="card">
            <h3>Categories</h3>
            <div class="chip-select" id="cat-chips">
              ${ALL_CATEGORIES.map((c) => `<div class="chip ${profile.categories.includes(c) ? 'selected' : ''}" data-cat="${escapeHtml(c)}" onclick="toggleChip(this)">${escapeHtml(c)}</div>`).join('')}
            </div>
          </div>

          <div class="card">
            <h3>Collaboration preferences</h3>
            ${prefCheckbox('barter', 'Barter collaborations')}
            ${prefCheckbox('paid', 'Paid collaborations')}
            ${prefCheckbox('events', 'Events')}
            ${prefCheckbox('restaurantVisits', 'Restaurant visits')}
            ${prefCheckbox('productGifting', 'Product gifting')}
            ${prefCheckbox('reels', 'Reels collaborations')}
            ${prefCheckbox('tiktokCollabs', 'TikTok collaborations')}
            ${prefCheckbox('availableForPlusOne', 'Available for +1 campaigns')}
            ${prefCheckbox('availableForTravel', 'Available for travel')}
            <label>Preferred minimum notice period (days)</label>
            <input type="number" id="p-notice" value="${profile.preferences.minNoticeDays || 7}" />
          </div>

          <button type="submit" class="btn btn-primary btn-block">Save Profile</button>
        </form>
      `;

      document.getElementById('profile-form').addEventListener('submit', save);
    }

    function prefCheckbox(key, label) {
      return `<div class="checkbox-row"><input type="checkbox" id="p-pref-${key}" ${profile.preferences[key] ? 'checked' : ''} /><label for="p-pref-${key}">${label}</label></div>`;
    }

    function toggleChip(el) { el.classList.toggle('selected'); }

    function save(e) {
      e.preventDefault();
      user.firstName = document.getElementById('p-first').value.trim();
      user.lastName = document.getElementById('p-last').value.trim();
      profile.phone = document.getElementById('p-phone').value.trim();
      profile.city = document.getElementById('p-city').value.trim();
      profile.country = document.getElementById('p-country').value.trim();
      profile.instagramUsername = document.getElementById('p-ig').value.trim();
      profile.social.instagram.followers = Number(document.getElementById('p-ig-followers').value || 0);
      profile.social.instagram.engagementRate = Number(document.getElementById('p-ig-eng').value || 0);
      profile.social.instagram.avgReelViews = Number(document.getElementById('p-ig-reel').value || 0);
      profile.social.instagram.avgStoryViews = Number(document.getElementById('p-ig-story').value || 0);
      profile.tiktokUsername = document.getElementById('p-tiktok').value.trim();
      profile.social.tiktok.followers = Number(document.getElementById('p-tiktok-followers').value || 0);
      profile.categories = [...document.querySelectorAll('#cat-chips .chip.selected')].map((el) => el.dataset.cat);
      ['barter', 'paid', 'events', 'restaurantVisits', 'productGifting', 'reels', 'tiktokCollabs', 'availableForPlusOne', 'availableForTravel'].forEach((key) => {
        profile.preferences[key] = document.getElementById(`p-pref-${key}`).checked;
      });
      profile.preferences.minNoticeDays = Number(document.getElementById('p-notice').value || 7);

      saveDB(db);
      toast('Profile saved.');
      render();
    }
  </script>
</body>
</html>
